blueprint:
  name: Relay Gate ⛩️
  source_url: "https://github.com/etiennec78/Home-Automation/blob/master/Extra/Relay-Gate-Blueprint/relay-gate.yaml"
  domain: script
  author: etiennec78
  description: |-
    # Relay Gate ⛩️

    ## Description 📝
    A script to transform a basic relay switch into a proper cover entity for your gate/garage door.

    > If you are using an [ESP32 with relay](https://amzn.to/3y2UtCr), you should use my [ESPHome firmware](https://github.com/etiennec78/Home-Automation/blob/master/ESPHome-Firmwares/Gate) instead

    > ⚠️ Since this script uses a relay without additional sensors, it cannot detect state changes from external controls (e.g: remotes). For consistent operation, use the same control method to open and then close consecutively.

    ## More info ℹ️
    * Version: 2.1.0
    * Github: [click here](https://github.com/etiennec78/Home-Automation/tree/master/Extra/Relay-Gate-Blueprint)
    * Discord: @etiennec78
    * Configure cover template: [click here](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md#virtual-gate-interface-%EF%B8%8F)
    [![ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/C0C5XVRMM)
  input:
    relay:
      name: ⛩️ Relay
      description: |-
        The **relay** that will be turned **on** to **move your gate**
      selector:
        entity:
          filter:
            domain: switch
    duration:
      name: 🕓 Duration of movement
      description: |-
        The **time** it takes for your gate to **open** or **close**
      selector:
        number:
          min: 10
          max: 300
          unit_of_measurement: s
    memory_helper:
      name: 🧠 Memory helper
      description: |-
        An empty **text helper** to store long term memory about the state of the gate
        > *Make this entity invisible to avoid flooding logs*
      selector:
        entity:
          filter:
            domain: input_text
    authorized_zone:
      name: Authorized zone
      icon: mdi:security
      collapsed: true
      input:
        persons:
          name: 👤 Persons / GPS trackers
          description: |-
            **Users** for whom the **position** must be checked before **opening** the gate
            > *Disabled if no user is provided*
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain:
                  - device_tracker
                  - person
        authorized_zone:
          name: 📍 Authorized zone
          description: |-
            The gate will **refuse** to **open** if no user is in this zone
            > *Setting it to 0 will require users to be at home*
          default: 1
          selector:
            number:
              min: 0
              max: 20
              step: 0.1
              unit_of_measurement: km

fields:
  mode:
    required: true
    selector:
      select:
        options:
          - label: Open
            value: open
          - label: Close
            value: close
          - label: Stop
            value: stop
          - label: Position  # If you call this script manually, you need to define the variable 'position' [0-100]
            value: position

mode: restart

variables:
  duration: !input duration
  memory_helper: !input memory_helper
  persons: !input persons
  authorized_zone: !input authorized_zone
  default_memory_helper_value:
    state: "closed"
    position: 0

sequence:
  - alias: Get the current gate state
    variables:
      gate_state: >-
        {%
          set state = (
            states(memory_helper)
            | from_json(default_memory_helper_value)
          )
        %}
        {%
          if default_memory_helper_value.keys() == state.keys()
        %}
          {{ state }}
        {% else %}
          {{ default_memory_helper_value }}
        {% endif %}
  - variables:
      someone_home: >-
        {% set valid = true if persons | length == 0 else false %}
        {% set data = namespace(valid=valid) %}
        {% for person in persons %}
          {% set dist = (
              not is_state_attr(person, 'latitude', null)
              and distance(person)
          ) %}
          {%
            if is_state(person, 'home')
            or dist is not none and dist <= authorized_zone
          %}
            {% set data.valid = true %}
            {% break %}
          {% endif %}
        {% endfor %}
        {{ data.valid }}
  - alias: If there is no one home, and the gate is closing
    if: "{{ not someone_home and gate_state.state == 'closing' }}"
    then:
      - alias: Override the mode to keep closing and ignore other requests
        variables:
          mode: close
  - alias: If the script has received a position
    if: "{{ mode == 'position' }}"
    then:
      - alias: Stop if no position was received
        if: "{{ position is not defined }}"
        then:
          - stop: No position received
            error: true
      - alias: Choose the correct mode
        variables:
          mode: >-
            {% if position == gate_state.position %}
              stop
            {% elif position > gate_state.position %}
              open
            {% else %}
              close
            {% endif %}
          position_target: "{{ position }}"
    else:
      - variables:
          position_target: >-
            {% if mode == 'open' %}
              {{ 100 }}
            {% elif mode == 'close' %}
              {{ 0 }}
            {% else %}
              {{ gate_state.position }}
            {% endif %}
  - alias: Only continue if someone is home
    condition: template
    value_template: "{{ true if mode == 'close' else someone_home }}"
  - variables:
      pulses: >-
        {% if mode == 'open' %}
          {% if gate_state.state in ['closed', 'closing'] %}
            {{ 1 }}
          {% elif gate_state.state == 'open' and gate_state.position < 100 %}
            {{ 2 }}
          {% else %}
            {{ 0 }}
          {% endif %}
        {% elif mode == 'close' %}
          {% if gate_state.state == 'open' %}
            {{ 1 }}
          {% elif gate_state.state == 'opening' %}
            {{ 2 }}
          {% else %}
            {{ 0 }}
          {% endif %}
        {% else %}
          {% if gate_state.state == 'opening' %}
            {{ 1 }}
          {% elif gate_state.state == 'closing' %}
            {{ 2 }}
          {% else %}
            {{ 0 }}
          {% endif %}
        {% endif %}
  - alias: Keep sending pulses until the gate is going in the right way
    repeat:
      while: "{{ pulses > 0 }}"
      sequence:
        - variables:
            update:
              state: >-
                {% set state = gate_state.state %}
                {% if state == 'open' %}
                  closing
                {% elif state == 'opening' %}
                  open
                {% else %}
                  opening
                {% endif %}
        - sequence: &update_helper
            - alias: Update the dict to store the new state
              variables:
                gate_state: "{{ gate_state | combine(update) }}"
            - alias: Save the new state to the helper
              action: input_text.set_value
              target:
                entity_id: !input memory_helper
              data:
                value: "{{ gate_state | to_json }}"
        - alias: Send a pulse
          action: homeassistant.turn_on
          target:
            entity_id: !input relay
        - variables:
            pulses: "{{ pulses - 1 }}"
        - alias: Only continue if there will be other pulses
          condition: "{{ pulses > 0 }}"
        - alias: Wait for the relay to turn off to send the next pulse
          delay: 2
  - alias: Wait for the gate to reach the targetted position
    repeat:
      while:
        - condition: template
          value_template: "{{ gate_state.position != position_target }}"
      sequence:
        - variables:
            update:
              position: >-
                {{
                  gate_state.position
                  + (1 if mode == 'open' else -1)
                }}
        - sequence: *update_helper
        - delay: "{{ duration / 100 }}"
  - variables:
      update:
        state: "{{ 'closed' if mode == 'close' else 'open' }}"
  - sequence: *update_helper
  - alias: If the gate should stop while not being fully open/closed
    if: "{{ position_target not in [0, 100] }}"
    then:
      - alias: Stop the gate
        action: homeassistant.turn_on
        target:
          entity_id: !input relay
