blueprint:
  name: Automatic Gate
  source_url: "https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/automatic-gate.yaml"
  domain: automation
  author: etiennec78
  description: |-
    # Automatic Gate ⛩️

    ## Description 📝
    **Modular** and **secure** gate automation that **opens your gate** upon leaving or arriving
    Makes managing your gate while driving easier : don't ever touch your screen or remote again
    Have your gate greet you when you arrive home and be ready for you
    Customize the options to tailor the system to your exact needs

    ## Key Features 🌟
    * **Automatic Opening**: Your gate will open automatically when you drive home. No need to press any buttons ! 🏠
    * **Smart Navigation**: Directly open the gate when leaving home, or launch an itinerary when starting from outside 🚀
    * **Multi-User Support**: Manages up to 10 drivers simultaneously 🚗
    * **Collision Prevention**: Ensures the gate doesn't close on anyone arriving or leaving at the same time 🚧
    * **Security & Reliability**:
      * Precise Waze and ETA calculations to have your gate fully open exactly when you arrive home 🎯
      * Real-time position tracking to adjust timing for traffic or if you pass by without entering 📍
      * Car status monitoring to cancel everything if you leave your car ✋
      * Built-in timeouts in case of an internet loss ⏳
      * Maximum entry and leaving time before auto-closing ⌛
      * Notification alerts at each decision of the automation 🚨
      * Manual actions prioritized over the automation, letting you control your gate even while the automation is running ✍️
    * **Customizable Settings**:
      * Auto-close with iBeacon 📡
      * Adjustable notifications 💬
      * Customizable security options 🔒
      * Customizable gate operation timings 🛠️
      * Customizable travel time refresh rate 🔁
      * Multiple gates supported by reusing the blueprint ♻️

    ## More info ℹ️
    * Version : 1.1.0
    * Set up sensors : [click here](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md)
    * Flowchart : [click here](https://miro.com/app/board/uXjVMpH4Tno=/)
    * Github : [click here](https://github.com/etiennec78/Home-Automation/tree/master/Automatic%20Gate)
    * Discord : etiennec78
    [!["Buy Me A Coffee"](https://www.buymeacoffee.com/assets/img/custom_images/yellow_img.png)](https://www.buymeacoffee.com/etiennec78)
  homeassistant:
    min_version: 2025.6.0
  input:
    essential_sensors:
      name: Essential sensors
      icon: "mdi:gate"
      collapsed: true
      input:
        gate:
          name: ⛩️ Gate
          description: The **switch** or **cover** which controls your **[gate](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md#gate-%EF%B8%8F)**
          selector:
            entity:
              multiple: true
              filter:
                domain:
                  - switch
                  - cover
        gate_location:
          name: 📍 Gate location
          description: The zone where your gate is located, to detect whether you are leaving or arriving
          default: "zone.home"
          selector:
            entity:
              filter:
                domain: zone
        lead_time:
          name: 🕓 Lead time
          description: The **lead time** to open the gate **before your arrival** (take your gate movement time & a margin into account)
          default: 75
          selector:
            number:
              min: 10
              max: 300
              unit_of_measurement: seconds

    per_person_sensors:
      name: Per person sensors
      icon: mdi:account-multiple
      collapsed: true
      description: |-
        ⚠️ Please enter the same amount of entires in each input, and place users in the same order
      input:
        persons:
          name: 👤 Tracked users
          description: |-
            Each **user** which should be **[tracked](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md#gps-location-trackers-)** for **position updates**
            *Notes :*
            *⚠️ Use high precision while driving in your ETA zone or you could time out*
            *If your tracker has report latency (wifi/ble), and you plug Android Auto just after leaving, your gate could open thinking you are still there*
          selector:
            entity:
              multiple: true
              filter:
                domain:
                  - device_tracker
                  - person
        driving_sensors:
          name: 🚗 Driving sensors
          description: Each **[driving sensor](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md#driving-sensors-)** which should trigger the automation
          selector:
            entity:
              multiple: true
              filter:
                domain: binary_sensor
        travel_time_sensors:
          name: ✈️ Travel time sensors
          description: |-
            Each **[travel time sensor](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md#travel-time-sensors-%EF%B8%8F)** monitoring each user **time left before arrival**
            *⚠️ Please set a [custom polling interval](https://www.home-assistant.io/integrations/waze_travel_time/#defining-a-custom-polling-interval)*
          selector:
            entity:
              multiple: true
              filter:
                domain: sensor
                device_class: duration
        notify_devices:
          name: 💬 Notify devices
          description: Each [**device** to **notify**](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md#notify-services-)
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        itinerary_sensors:
          name: 🗺️ Itinerary sensors
          description: Each empty **[itinerary input text](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md#itinerary-sensors-%EF%B8%8F)** helper to store each user **itinerary state**
          selector:
            entity:
              multiple: true
              filter:
                domain: input_text

    automation_settings:
      name: Automation settings
      icon: mdi:cog
      collapsed: true
      input:
        travel_time_rate:
          name: 🔄 Travel time refresh rate
          description: |-
            Calculate the Travel time & ETA

              - **Continuously** during the whole itinerary (custom refresh interval while away)
              - Only while the vehicle is **near home**
              - Only **once** when the vehicle gets near home

            **"Continuously"** can use more Waze/Maps credits, but can be useful to display a precise ETA on your dashboard when far from your destination
            **"While near home"** allows to monitor if you drive near your gate without entering to abort the itinerary, or if there are traffic jams near home to open later (recommended)
            **"Only once"** uses the less amount of credits, but could trigger if you come near your gate without entering (not recommended)
          default: While near home
          selector:
            select:
              options:
                - Continuously
                - While near home
                - Once when near home
        continuously_refresh_interval:
          name: ⏳ Continuously refresh interval
          description: Your travel time **refresh interval** while away. Only active with a refresh rate set to **"Continuously"**
          default: 5
          selector:
            number:
              min: 1
              max: 60
              unit_of_measurement: minutes
        eta_zone:
          name: 🚀 ETA planning zone
          description: |-
            At which **distance** from gate should your vehicle start planning its **Estimated Time of Arrival** to **open your gate** ?
          default: 1000
          selector:
            number:
              min: 200
              max: 5000
              unit_of_measurement: meters
        activation_zone:
          name: 🔒 Gate activation zone
          description: At which **maximal distance** should your vehicle be able to automatically **open your gate** ? It will automatically **close** if you **leave** this zone
          default: 1200
          selector:
            number:
              min: 300
              max: 5000
              unit_of_measurement: meters
        automatic_closing:
          name: 🔒 Automatic closing behavior
          description: |-
            Gate automatic **closing** behavior

              - **Automatically close** your gate after you reach your destination (or leave if ble sensors are set)
              - **Only close for safety mechanism**, in case you don't want your gate to close automatically but want to keep safety features
              - **Never close** at all, in case your gate doesn't support closing. This will disable almost all safety features
          default: "on"
          selector:
            select:
              options:
                - label: Automatically close
                  value: "on"
                - label: Only close for safety mechanism
                  value: "only-safety"
                - label: Never close
                  value: "off"
        safety_delay:
          name: 🔒 Auto-close safety delay
          description: The time the gate will wait before **automatically closing** if your gate is open but you still haven't left or arrived
          default: 5
          selector:
            number:
              min: 2
              max: 30
              unit_of_measurement: minutes
        timeout_delay:
          name: ⌛ Timeout delay
          description: |-
            The time the automation will wait before **stopping** if your phone **times out** and doesn't send new position updates, while being in the activation zone
            *Note : If your position provider doesn't let you use a high accuracy mode (like iOS), please increase this value*
          default: 2
          selector:
            number:
              min: 0.5
              max: 30
              unit_of_measurement: minutes
        auto_close_arrival_delay:
          name: 📬 Auto-close delay after arrival
          description: |-
            The time the gate will wait before **automatically closing** after you arrive home and you have left your car
            *Note : Can be useful if you plan to collect mail or put away groceries after arriving*
          default: 0
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: minutes

    notification_settings:
      name: Notification settings
      icon: mdi:bell
      collapsed: true
      description: |-
        Notification settings to translate texts or change notification behavior
      input:
        itinerary_update_title:
          name: 📃ℹ️ Itinerary status update title
          description: The **title** displayed on the notification you will receive when the **status of your itinerary** changes
          default: "Itinerary ℹ️"
          selector:
            text:
        itinerary_canceled_title:
          name: 📃❌ Itinerary canceled title
          description: The **title** displayed on the notification you will receive when your **itinerary gets canceled**
          default: "Itinerary canceled ❌"
          selector:
            text:
        awaiting_title:
          name: 📃💤 Gate awaiting user notification title
          description: |-
            The **title** displayed on the notification you will receive when your gate is **awaiting another user**
            *Note : {{awaiting_persons}} will be replaced by the list of the users being awaited*
          default: "Gate awaiting {{ awaiting_persons }} 💤"
          selector:
            text:
        itinerary_started_message:
          name: 💬🚀 Itinerary started notification
          description: The **content** of the notification you will receive when your **itinerary starts**
          default: "Your itinerary has been started"
          selector:
            text:
        awaiting_message:
          name: 💬💤 Gate awaiting user notification
          description: The **content** of the notification you will receive when your gate is **awaiting another user**
          default: "The gate will close once all users have entered/exited"
          selector:
            text:
              multiline: true
        vehicle_left_message:
          name: 💬⚠️ Vehicle left notification
          description: The **content** of the notification you will receive if you **leave your vehicle**
          default: "You have left your vehicle"
          selector:
            text:
              multiline: true
        did_not_leave_message:
          name: 💬⚠️ User did not leave notification
          description: |-
            The **content** of the notification you will receive if you **don't leave in time**
            *Note : {{safety_delay}} will be replaced by your auto-close delay you have set above*
          default: "The vehicle did not leave in less than {{ safety_delay }} minutes"
          selector:
            text:
              multiline: true
        did_not_arrive_message:
          name: 💬⚠️ User did not arrive notification
          description: |-
            The **content** of the notification you will receive if you **don't arrive in time**
            *Note : {{safety_delay}} will be replaced by your auto-close delay you have set above*
          default: "The vehicle did not arrive in less than {{ safety_delay }} minutes"
          selector:
            text:
              multiline: true
        timed_out_message:
          name: 💬⚠️ Timed out notification
          description: |-
            The **content** of the notification you will receive if you **time out**
            *Note : {{timeout_delay}} will be replaced by your auto-close delay you have set above*
          default: "Your position has not been updated in {{ timeout_delay }} minutes"
          selector:
            text:
              multiline: true
        vehicle_away_message:
          name: 💬⚠️ Vehicle not in activation zone notification
          description: The **content** of the notification you will receive if **you are not in your activation zone**
          default: "The vehicle is not in the activation zone"
          selector:
            text:
              multiline: true
        travel_time_did_not_respond:
          name: 💬⚠️ Travel time integration did not respond
          description: The **content** of the notification you will receive if your **travel time integraton did not respond** during the itinerary
          default: "Your travel time integration did not respond during your itinerary"
        not_home_message:
          name: 💬⚠️ Not home notification
          description: The **content** of the notification you will receive if your **iBeacon or WiFi tracker** did not report you at home
          default: "You were not detected at home"
        triggered_frequently_message:
          name: 💬⚠️ Triggered frequently notification
          description: The **content** of the notification you will receive if the blueprint is **triggered too frequently**
          default: "The blueprint is being triggered repeatedly !"

    optional_sensors:
      name: Optional sensors
      icon: mdi:dots-horizontal-circle-outline
      collapsed: true
      input:
        ble_entities:
          name: 🔎 iBeacon tracker entities
          description: |-
            Each **[BLE rssi tracker entity](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md#bluetooth-entities-)** to monitor your distance from the gate while leaving, to close it when you're out of reach
            Needs [bluetooth transmitters](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md#bluetooth-transmitter-) set on companion apps
            *Note : Let empty if no ble*
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: sensor
                device_class: signal_strength
        ble_scanner_switch:
          name: ⏯️ iBeacon scanner activator switch
          description: |-
            The **[switch](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md#bluetooth-scanner-switch-)** you want to use to turn on and off your **iBeacon scanner** when a vehicle is leaving
            *Note : Let empty if no ble / want to always keep iBeacon running*
          default: ""
          selector:
            entity:
              filter:
                domain: switch
        ble_transmitter_entities:
          name: 📡 iBeacon transmitter entities
          description: |-
            Each **[BLE transmitter entity]()** to restore previous iBeacon transmitter power settings after having closed the gate
            Needs [bluetooth transmitters](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md#bluetooth-transmitter-) set on companion apps
            *Notes :*
            *Let empty if you use iOS, don't want iBeacon, or only use iBeacon for this automation*
            *If let empty, the iBeacon transmitter will be disabled on Android after having closed the gate*
          default: []
          selector:
            entity:
              multiple: true
              filter:
                integration: mobile_app
                domain: sensor
                device_class: enum
        only_open_near_iBeacon:
          name: 🏠 Only open while near iBeacon
          description: |-
            Should your gate only open if you are reachable from your iBeacon ?
            *Note : Useful to prevent your gate from opening if you are parked outside in front of your house*
          default: false
          selector:
            boolean:
        wifi_devices:
          name: 🏠 WiFi devices
          description: |-
            WiFi entities to make your gate only open if you are connected to your WiFi network
            *Notes :*
            *Useful to prevent your gate from opening if you are parked outside in front of your house*
            *WiFi can be slow to report new states*
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: device_tracker
        locks:
          name: 🔐 Locks
          description: |-
            The **locks** that open your home's **doors**
            *Note : They will lock on exit once the gate is closed, and unlock once the vehicle has arrived and been turned off*
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: lock

variables:
  gate: !input gate
  gate_location: !input gate_location
  lead_time: !input lead_time
  safety_delay: !input safety_delay
  timeout_delay: !input timeout_delay
  persons: !input persons
  driving_sensors: !input driving_sensors
  travel_time_sensors: !input travel_time_sensors
  notify_devices: !input notify_devices
  notify_services: "{{ notify_devices | map('device_attr', 'name') | map('slugify') | map('regex_replace', '^', 'notify.mobile_app_') | list }}"
  itinerary_sensors: !input itinerary_sensors
  travel_time_rate: !input travel_time_rate
  continuously_refresh_interval: !input continuously_refresh_interval
  eta_zone: !input eta_zone
  activation_zone: !input activation_zone
  ble_entities: !input ble_entities
  ble_scanner_switch: !input ble_scanner_switch
  ble_transmitter_entities: !input ble_transmitter_entities
  automatic_closing: !input automatic_closing
  only_open_near_iBeacon: !input only_open_near_iBeacon
  wifi_devices: !input wifi_devices

triggers:
  - alias: Trigger when user connects to vehicle
    trigger: state
    entity_id: !input driving_sensors
    from: "off"
    to: "on"

conditions: []

actions:
  - alias: Store list index of driver, extract driver sensors
    variables:
      idx: "{{ driving_sensors.index(trigger.entity_id) }}"
      person: "{{ persons[idx] }}"
      driving_sensor: "{{ trigger.entity_id }}"
      travel_time_sensor: "{{ travel_time_sensors[idx] }}"
      notify_service: "{{ notify_services[idx] }}"
      itinerary_sensor: "{{ itinerary_sensors[idx] }}"

  - alias: If driver at gate location
    if:
      - condition: template
        value_template: "{{ is_state(person, [state_attr(gate_location, 'friendly_name'), states[gate_location].object_id]) }}"
    then:
      #####################
      # OPEN GATE ON EXIT #
      #####################

      - alias: Stop if blueprint is triggered frequently
        if:
          - condition: template
            value_template: "{{ states[itinerary_sensor].last_updated + timedelta(minutes=2) > now() }}"
        then:
          - alias: Reset itinerary last_updated attribute
            action: input_text.set_value
            target:
              entity_id: "{{ itinerary_sensor }}"
            data:
              value: none
          - alias: Notify driver that the blueprint is being triggered frequently
            action: "{{ notify_service }}"
            data:
              title: !input itinerary_canceled_title
              message: !input triggered_frequently_message
              data:
                car_ui: true
                notification_icon: mdi:alert-circle
                channel: Itinerary status
                importance: critical
                push:
                  sound:
                    name: "default"
                    critical: 1
                tag: itinerary-status
                timeout: 300
          - stop: Blueprint triggered too frequently
            error: true
      - alias: If driver has iBeacon entity set for auto-closing
        if:
        - condition: template
          value_template: "{{ (ble_entities | length) - 1 >= idx }}"
        then:
          - alias: Save iBeacon states
            variables:
              old_ibeacon_transmitter_states: |-
                {% if (ble_transmitter_entities | length) - 1 >= idx %}
                  {{ {
                    'state': states(ble_transmitter_entities[idx])
                      if states(ble_transmitter_entities[idx]) == 'Stopped' else none,
                    'transmit_power': (state_attr(ble_transmitter_entities[idx], 'Transmitting power') | regex_replace('([a-z])([A-Z])', '\\1_\\2') | lower)
                      if state_attr(ble_transmitter_entities[idx], 'Transmitting power') != 'high' else none,
                    'advertise_mode': (state_attr(ble_transmitter_entities[idx], 'Advertise mode') | regex_replace('([a-z])([A-Z])', '\\1_\\2') | lower)
                      if state_attr(ble_transmitter_entities[idx], 'Advertise mode') != 'lowLatency' else none
                  } }}
                {% else %}
                  {{ none }}
                {% endif %}
          - alias: If driver has a saved iBeacon transmitter state
            if:
              - condition: template
                value_template: "{{ old_ibeacon_transmitter_states != none }}"
            then:
              - alias: Change iBeacon state if needed
                if:
                  - condition: template
                    value_template: "{{ old_ibeacon_transmitter_states['state'] != none }}"
                then:
                  - action: "{{ notify_service }}"
                    data:
                      message: command_ble_transmitter
                      data:
                        command: turn_on
              - alias: Change iBeacon transmitting power if needed
                if:
                  - condition: template
                    value_template: "{{ old_ibeacon_transmitter_states['transmit_power'] != none }}"
                then:
                  - action: "{{ notify_service }}"
                    data:
                      message: command_ble_transmitter
                      data:
                        command: ble_set_transmit_power
                        ble_transmit: ble_transmit_high
              - alias: Change iBeacon advertise mode if needed
                if:
                  - condition: template
                    value_template: "{{ old_ibeacon_transmitter_states['advertise_mode'] != none }}"
                then:
                  - action: "{{ notify_service }}"
                    data:
                      message: command_ble_transmitter
                      data:
                        command: ble_set_advertise_mode
                        ble_advertise: ble_advertise_low_latency
          - alias: Activate iBeacon scanner if switch set
            if:
            - condition: template
              value_template: "{{ ble_scanner_switch != '' and is_state(ble_scanner_switch, 'off') }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: "{{ ble_scanner_switch }}"
      - alias: If driver chose to wait for iBeacon or WiFi before opening to ensure that vehicle is not parked outside
        if:
        - condition: template
          value_template: "{{ only_open_near_iBeacon and (ble_entities | length) - 1 >= idx or (wifi_devices | length) - 1 >= idx }}"
        then:
          - alias: Wait for iBeacon or WiFi to report home
            wait_template: "{{ not is_state(ble_entities[idx], 'unknown') or is_state(wifi_devices[idx], 'home') }}"
            continue_on_timeout: true
            timeout: 10
          - alias: If timeout reached
            if:
            - condition: template
              value_template: "{{ wait.remaining == 0 }}"
            then:
              - alias: Notify driver of itinerary cancelation as he was not home
                action: "{{ notify_service }}"
                data:
                  title: !input itinerary_canceled_title
                  message: !input not_home_message
                  data:
                    car_ui: true
                    notification_icon: mdi:alert-circle
                    channel: Itinerary status
                    importance: high
                    push:
                      sound:
                        name: "default"
                        critical: 1
                    tag: itinerary-status
                    timeout: 300
              - alias: Restore iBeacon states
                sequence: &restore_ibeacons
                  - alias: If driver has an iBeacon entity set for auto-closing
                    if:
                      - condition: template
                        value_template: "{{ (ble_entities | length) - 1 >= idx }}"
                    then:
                      - alias: If driver has a saved iBeacon transmitter state
                        if:
                          - condition: template
                            value_template: "{{ old_ibeacon_transmitter_states != none }}"
                        then:
                          - alias: If iBeacon transmitter was stopped, stop it
                            if:
                              - condition: template
                                value_template: "{{ old_ibeacon_transmitter_states['state'] != none }}"
                            then:
                              - action: "{{ notify_service }}"
                                data:
                                  message: command_ble_transmitter
                                  data:
                                    command: turn_off
                          - alias: If iBeacon transmitting power was not set to high, restore it
                            if:
                              - condition: template
                                value_template: "{{ old_ibeacon_transmitter_states['transmit_power'] != none }}"
                            then:
                              - action: "{{ notify_service }}"
                                data:
                                  message: command_ble_transmitter
                                  data:
                                    command: ble_set_transmit_power
                                    ble_transmit: "ble_transmit_{{ old_ibeacon_transmitter_states['transmit_power'] }}"
                          - alias: If iBeacon transmitter advertise power was not set to low latency, restore it
                            if:
                              - condition: template
                                value_template: "{{ old_ibeacon_transmitter_states['advertise_mode'] != none }}"
                            then:
                              - action: "{{ notify_service }}"
                                data:
                                  message: command_ble_transmitter
                                  data:
                                    command: ble_set_advertise_mode
                                    ble_advertise: "ble_advertise_{{ old_ibeacon_transmitter_states['advertise_mode'] }}"
                  - alias: If iBeacon switch set, and doesn't need to stay on
                    if:
                      - condition: template
                        value_template: "{{ ble_scanner_switch != '' and itinerary_sensors | select('is_state', ['on_approach', 'leaving']) | list == [] }}"
                    then:
                      - alias: Deactivate iBeacon scanner
                        action: switch.turn_off
                        target:
                          entity_id: "{{ ble_scanner_switch }}"
              - stop: Not home
      - alias: Set driver itinerary to "leaving"
        action: input_text.set_value
        target:
          entity_id: "{{ itinerary_sensor }}"
        data:
          value: leaving
      - alias: If one of the gates is closing/closed
        if:
          - condition: template
            value_template: "{{ gate | select('is_state', ['off', 'closed', 'closing']) | list != [] }}"
        then:
          - alias: Open each gate because driver is leaving
            repeat:
              for_each: !input gate
              sequence:
                - action: |-
                    {% if states[repeat.item].domain == 'switch' %}
                      switch.turn_on
                    {% elif states[repeat.item].domain == 'cover' %}
                      cover.open_cover
                    {% endif %}
                  target:
                    entity_id: "{{ repeat.item }}"
      - alias: If auto-closing is enabled
        if:
          - condition: template
            value_template: "{{ automatic_closing == 'on' }}"
        then:
          - alias: Wait for gate closed manually, iBeacon out of reach for 20s, vehicle left, driver left, for at most auto-close delay
            wait_for_trigger:
              - trigger: template
                id: manual
                value_template: "{{ gate | select('is_state', ['off', 'closed', 'closing']) | list != [] }}"
              - trigger: template
                id: ble
                value_template: "{{ (ble_entities | length) - 1 >= idx and is_state(ble_entities[idx], 'unknown') }}"
              - trigger: template
                id: vehicle_left
                value_template: "{{ is_state(driving_sensor, 'off') }}"
              - trigger: template
                id: gate_zone_left
                value_template: |-
                  {% if state_attr(person, 'gps_accuracy') is none %}
                    {{ distance(person, gate_location)*1000 > activation_zone }}
                  {% else %}
                    {{ distance(person, gate_location)*1000 > state_attr(gate_location, 'radius') + state_attr(person, 'gps_accuracy') }}
                  {% endif %}
            timeout:
              minutes: !input safety_delay
          - alias: Remove current itinerary as driver left or took too long
            action: input_text.set_value
            target:
              entity_id: "{{ itinerary_sensor }}"
            data:
              value: none
          - alias: Restore iBeacon states
            sequence: *restore_ibeacons
          - alias: If no one else leaving or approaching
            if:
              - condition: template
                value_template: "{{ itinerary_sensors | select('is_state', ['on_approach', 'leaving']) | list == [] }}"
            then:
              - alias: If timeout reached
                if:
                  - condition: template
                    value_template: "{{ wait.remaining == 0 }}"
                then:
                  - alias: Notify driver of itinerary cancelation as he didn't leave in time
                    action: "{{ notify_service }}"
                    data:
                      title: !input itinerary_canceled_title
                      message: !input did_not_leave_message
                      data:
                        car_ui: true
                        notification_icon: mdi:alert-circle
                        channel: Gate alerts
                        importance: high
                        push:
                          sound:
                            name: "default"
                            critical: 1
                        tag: itinerary-status
                        timeout: 300
              - alias: Close all gates
                repeat:
                  for_each: !input gate
                  sequence:
                    - action: |-
                        {% if states[repeat.item].domain == 'switch' %}
                          switch.turn_off
                        {% elif states[repeat.item].domain == 'cover' %}
                          cover.close_cover
                        {% endif %}
                      target:
                        entity_id: "{{ repeat.item }}"
              - alias: Lock all locks
                repeat:
                  for_each: !input locks
                  sequence:
                    - action: lock.lock
                      target:
                        entity_id: "{{ repeat.item }}"
            else:
              - alias: Get names of awaited persons
                variables:
                  awaiting_persons: |-
                    {% set data = namespace(awaiting_persons=[]) %}

                    {% for sensor_idx in range(itinerary_sensors | length) %}
                      {% if sensor_idx != idx and is_state(itinerary_sensors[sensor_idx], ['on_approach', 'leaving']) %}
                        {% set data.awaiting_persons = data.awaiting_persons + [state_attr(persons[sensor_idx], 'friendly_name')] %}
                      {% endif %}
                    {% endfor %}

                    {{ data.awaiting_persons | join(', ') }}
              - alias: Notify driver that gate will wait for next person
                action: "{{ notify_service }}"
                data:
                  title: !input awaiting_title
                  message: !input awaiting_message
                  data:
                    car_ui: true
                    notification_icon: mdi:sleep
                    channel: Gate alerts
                    importance: high
                    push:
                      sound:
                        name: "default"
                        critical: 1
                    tag: itinerary-status
              - alias: Wait for gate closed
                wait_for_trigger:
                  - trigger: template
                    value_template: "{{ gate | select('is_state', ['off', 'closed', 'closing']) | list != [] }}"
              - alias: Remove awaiting user notification
                action: "{{ notify_service }}"
                data:
                  message: clear_notification
                  data:
                    tag: itinerary-status
        else:
          - alias: Wait for driver to leave
            wait_for_trigger:
              - trigger: template
                id: gate_zone_left
                value_template: "{{ not is_state(person, [state_attr(gate_location, 'friendly_name'), states[gate_location].object_id]) }}"
          - alias: Remove current itinerary
            action: input_text.set_value
            target:
              entity_id: "{{ itinerary_sensor }}"
            data:
              value: none
          - alias: Restore iBeacon states
            sequence: *restore_ibeacons
      - alias: Wait for driver to travel 350m away from eta zone, then return to 100m, to start itinerary
        repeat:
          count: 2
          sequence:
            - wait_for_trigger:
                - trigger: template
                  id: vehicle_left
                  value_template: "{{ is_state(driving_sensor, 'off') }}"
                - trigger: template
                  id: left_gate_zone
                  value_template: "{{ distance(person, gate_location)*1000 > eta_zone + 350 }}"
                - trigger: template
                  id: returned_to_gate_zone
                  value_template: "{{ distance(person, gate_location)*1000 < eta_zone + 100 }}"
            - alias: Don't continue if driver stopped vehicle
              if:
                - condition: template
                  value_template: "{{ wait.trigger.id == 'vehicle_left' }}"
              then:
                - stop: Arrived to destination

    else:
      - alias: Stop if driver started driving in eta zone
        if:
          - condition: template
            value_template: "{{ distance(person, gate_location)*1000 > eta_zone }}"
        then:
          - stop: Started too close to home

  ###################
  # START ITINERARY #
  ###################

  - alias: Set driver itinerary to "arriving"
    action: input_text.set_value
    target:
      entity_id: "{{ itinerary_sensor }}"
    data:
      value: arriving
  - alias: Notify driver of itinerary start
    action: "{{ notify_service }}"
    data:
      title: !input itinerary_update_title
      message: !input itinerary_started_message
      data:
        car_ui: true
        notification_icon: mdi:map-check
        channel: Itinerary status
        importance: high
        push:
          sound:
            name: "default"
            critical: 1
        tag: itinerary-status
  - alias: If travel time refresh rate set to "Continuously"
    if:
      - condition: template
        value_template:  "{{ travel_time_rate == 'Continuously' }}"
    then:
      - alias: Update travel time once to display ETA on dashboard
        action: homeassistant.update_entity
        target:
          entity_id: "{{ travel_time_sensor }}"
  - alias: Repeat while driver still driving
    repeat:
      while:
        - condition: template
          value_template: "{{ is_state(driving_sensor, 'on') }}"
      sequence:
        - alias: If travel time expired and refresh rate set to "Continuously"
          if:
            - condition: template
              value_template:  "{{ travel_time_rate == 'Continuously' and
                states[travel_time_sensor].last_updated + timedelta(minutes=1) < now() }}"
          then:
            - alias: Refresh travel time
              action: homeassistant.update_entity
              target:
                entity_id: "{{ travel_time_sensor }}"
        - alias: Wait for new driver position or vehicle left
          wait_for_trigger:
            - trigger: event
              event_type: state_changed
              event_data:
                entity_id: "{{ person }}"
            - trigger: template
              value_template: "{{ is_state(driving_sensor, 'off') }}"
        - alias: Repeat while driver nearer than 1km from gate and still driving
          # This allows to update to a precise ETA even if a traffic jam appears near your gate
          # It will return to the previous loop if the driver has entered the radius but passed by
          repeat:
            while:
              - condition: template
                value_template: "{{ distance(person, gate_location)*1000 < eta_zone }}"
              - condition: template
                value_template: "{{ is_state(driving_sensor, 'on') }}"
            sequence:
              - alias: Update travel time if new position
                action: homeassistant.update_entity
                target:
                  entity_id: "{{ travel_time_sensor }}"
              - alias: Wait for travel time integration to refresh
                condition: template
                value_template: |-
                    {{ states[travel_time_sensor].last_updated > now() - timedelta(seconds=5)
                          and states[travel_time_sensor].last_changed > now() - timedelta(minutes=5) }}
              - alias: Convert travel time to seconds and set opening time
                variables:
                  travel_time_duration: |-
                    {% if (state_attr(travel_time_sensor, 'duration') != none) %}
                      {{ state_attr(travel_time_sensor, 'duration') | float * 60 }}
                    {% elif (state_attr(travel_time_sensor, 'unit_of_measurement') == "min") %}
                      {{ states(travel_time_sensor) | float * 60 }}
                    {% elif (state_attr(travel_time_sensor, 'unit_of_measurement') == "s") %}
                      {{ states(travel_time_sensor) | float }}
                    {% else %}
                      unknown
                    {% endif %}
                  opening_time: |-
                    {{ states[travel_time_sensor].last_updated | as_timestamp
                        + travel_time_duration
                        - lead_time }}
                  seconds_before_opening: "{{ opening_time - now() | as_timestamp }}"
              - alias: If ETA in the future
                if:
                  - condition: template
                    value_template: "{{ seconds_before_opening > 1 }}"
                then:
                  - alias: If travel time refresh rate set to "Once when near home"
                    if:
                      - condition: template
                        value_template: "{{ travel_time_rate == 'Once when near home' }}"
                    then:
                      - alias: Wait for ETA or vehicle left
                        wait_for_trigger:
                          - trigger: template
                            value_template: "{{ is_state(driving_sensor, 'off') }}"
                        timeout:
                          seconds: "{{ seconds_before_opening }}"
                    else:
                      - alias: Wait for ETA, new position, vehicle left, and cancel if deviced timed out
                        wait_for_trigger:
                          - trigger: event
                            event_type: state_changed
                            event_data:
                              entity_id: "{{ person }}"
                          - trigger: template
                            value_template: "{{ is_state(driving_sensor, 'off') }}"
                        timeout:
                          seconds: "{{ min(timeout_delay*60, seconds_before_opening) }}"
                      - alias: If timeout ran out of time (not because of eta reached)
                        if:
                          - condition: template
                            value_template: "{{ wait.remaining == 0 and
                                                opening_time > now() | as_timestamp }}"
                        then:
                          - alias: Remove current itinerary as driver timed out
                            action: input_text.set_value
                            target:
                              entity_id: "{{ itinerary_sensor }}"
                            data:
                              value: none
                          - alias: Notify driver about itinerary cancellation
                            action: "{{ notify_service }}"
                            data:
                              title: !input itinerary_canceled_title
                              message: !input timed_out_message
                              data:
                                car_ui: true
                                notification_icon: mdi:alert-circle
                                channel: Itinerary status
                                importance: high
                                push:
                                  sound:
                                    name: "default"
                                    critical: 1
                                tag: itinerary-status
                                timeout: 300
                          - stop: Timed out

              # Restart the second repeat loop if the wait_for_trigger was triggered by a position or vehicle sensor update
              # This allows the loop to refresh the ETA with a new position or stop the script if the vehicle was left
              - condition: template
                value_template: "{{ opening_time <= as_timestamp(now()) }}"
              - if:
                  - alias: User is not in activation zone
                    condition: template
                    value_template: "{{ distance(person, gate_location)*1000 > activation_zone }}"
                then:
                  - alias: Stop itinerary as driver was not in activation zone when gate tried to open
                    action: input_text.set_value
                    target:
                      entity_id: "{{ itinerary_sensor }}"
                    data:
                      value: none
                  - alias: Notify driver about itinerary cancellation
                    action: "{{ notify_service }}"
                    data:
                      title: !input itinerary_canceled_title
                      message: !input vehicle_away_message
                      data:
                        car_ui: true
                        notification_icon: mdi:alert-circle
                        channel: Itinerary status
                        importance: high
                        push:
                          sound:
                            name: "default"
                            critical: 1
                        tag: itinerary-status
                        timeout: 300
                  - stop: Not in activation zone
              - alias: Set driver itinerary text variable to "on_approach", because driver is near gate and will arrive soon
                action: input_text.set_value
                data:
                  value: on_approach
                target:
                  entity_id: "{{ itinerary_sensor }}"
              - alias: If one of the gates is closing/closed
                if:
                  - condition: template
                    value_template: "{{ gate | select('is_state', ['off', 'closed', 'closing']) | list != [] }}"
                then:
                  - alias: Open each gate because driver is arriving
                    repeat:
                      for_each: !input gate
                      sequence:
                        - action: |-
                            {% if states[repeat.item].domain == 'switch' %}
                              switch.turn_on
                            {% elif states[repeat.item].domain == 'cover' %}
                              cover.open_cover
                            {% endif %}
                          target:
                            entity_id: "{{ repeat.item }}"
              - alias: If auto-closing is not fully disabled
                if:
                  - condition: template
                    value_template: "{{ automatic_closing != 'off' }}"
                then:
                  - alias: Wait for gate closed manually, or vehicle left, or driver left, for at most auto-close delay
                    wait_for_trigger:
                      - trigger: template
                        id: manual
                        value_template: "{{ gate | select('is_state', ['off', 'closed', 'closing']) | list != [] }}"
                      - trigger: template
                        id: vehicle_left
                        value_template: "{{ is_state(driving_sensor, 'off') }}"
                      - trigger: template
                        id: activation_zone_left
                        value_template: "{{ distance(person, gate_location)*1000 > activation_zone }}"
                    timeout:
                      minutes: !input safety_delay
                  - alias: Stop itinerary as driver arrived or took too long
                    action: input_text.set_value
                    target:
                      entity_id: "{{ itinerary_sensor }}"
                    data:
                      value: none
                  - alias: If gate closed manually
                    if:
                      - condition: template
                        value_template: "{{ wait.trigger.id == 'manual' }}"
                    then:
                      - alias: Remove itinerary started notification
                        action: "{{ notify_service }}"
                        data:
                          message: clear_notification
                          data:
                            tag: itinerary-status
                    else:
                      - alias: If someone is currently approaching or leaving
                        if:
                          - condition: template
                            value_template: "{{ itinerary_sensors | select('is_state', ['on_approach', 'leaving']) | list != [] }}"
                        then:
                          - alias: Get names of awaited persons
                            variables:
                              awaiting_persons: |-
                                {% set data = namespace(awaiting_persons=[]) %}

                                {% for sensor_idx in range(itinerary_sensors | length) %}
                                  {% if sensor_idx != idx and is_state(itinerary_sensors[sensor_idx], ['on_approach', 'leaving']) %}
                                    {% set data.awaiting_persons = data.awaiting_persons + [state_attr(persons[sensor_idx], 'friendly_name')] %}
                                  {% endif %}
                                {% endfor %}

                                {{ data.awaiting_persons | join(', ') }}
                          - alias: Notify driver that gate will wait for next person
                            action: "{{ notify_service }}"
                            data:
                              title: !input awaiting_title
                              message: !input awaiting_message
                              data:
                                car_ui: true
                                notification_icon: mdi:sleep
                                channel: Itinerary status
                                importance: high
                                push:
                                  sound:
                                    name: "default"
                                    critical: 1
                                tag: itinerary-status
                          - alias: Wait for gate closed
                            wait_for_trigger:
                              - trigger: template
                                value_template: "{{ gate | select('is_state', ['off', 'closed', 'closing']) | list != [] }}"
                        else:
                          - choose:
                              - alias: If timeout reached
                                conditions:
                                  - condition: template
                                    value_template: "{{ wait.remaining == 0 }}"
                                sequence:
                                  - alias: Notify driver of itinerary cancelation as he took too long
                                    action: "{{ notify_service }}"
                                    data:
                                      title: !input itinerary_canceled_title
                                      message: !input did_not_arrive_message
                                      data:
                                        car_ui: true
                                        notification_icon: mdi:alert-circle
                                        channel: Gate alerts
                                        importance: high
                                        push:
                                          sound:
                                            name: "default"
                                            critical: 1
                                        tag: itinerary-status
                                        timeout: 300
                              - alias: If driver exited gate activation zone
                                conditions:
                                  - condition: template
                                    value_template: "{{ wait.trigger.id == 'activation_zone_left' }}"
                                sequence:
                                  - alias: Notify driver of itinerary cancelation as he exited the zone
                                    action: "{{ notify_service }}"
                                    data:
                                      title: !input itinerary_canceled_title
                                      message: !input vehicle_away_message
                                      data:
                                        car_ui: true
                                        notification_icon: mdi:alert-circle
                                        channel: Gate alerts
                                        importance: high
                                        push:
                                          sound:
                                            name: "default"
                                            critical: 1
                                        tag: itinerary-status
                                        timeout: 300
                              - alias: If driver arrived, stopped vehicle, and auto-closing is enabled
                                conditions:
                                  - condition: template
                                    value_template: "{{ wait.trigger.id == 'vehicle_left' and
                                                        is_state(person, [state_attr(gate_location, 'friendly_name'), states[gate_location].object_id]) and
                                                        automatic_closing == 'on' }}"
                                sequence:
                                  - delay:
                                      minutes: !input auto_close_arrival_delay
                              - alias: If driver left vehicle
                                conditions:
                                  - condition: template
                                    value_template: "{{ wait.trigger.id == 'vehicle_left' }}"
                                sequence:
                                  - alias: Notify driver of itinerary cancelation as he left vehicle
                                    action: "{{ notify_service }}"
                                    data:
                                      title: !input itinerary_canceled_title
                                      message: !input vehicle_left_message
                                      data:
                                        car_ui: true
                                        notification_icon: mdi:alert-circle
                                        channel: Gate alerts
                                        importance: high
                                        push:
                                          sound:
                                            name: "default"
                                            critical: 1
                                        tag: itinerary-status
                                        timeout: 300
                            # If driver arrived but doesn't have automatic gate enabled
                            default:
                              - alias: Remove itinerary started notification
                                action: "{{ notify_service }}"
                                data:
                                  message: clear_notification
                                  data:
                                    tag: itinerary-status
                              - alias: Stop whole script as successful
                                stop: Successful
                          - alias: Close all gates
                            repeat:
                              for_each: !input gate
                              sequence:
                                - action: |-
                                    {% if states[repeat.item].domain == 'switch' %}
                                      switch.turn_off
                                    {% elif states[repeat.item].domain == 'cover' %}
                                      cover.close_cover
                                    {% endif %}
                                  target:
                                    entity_id: "{{ repeat.item }}"
                          - alias: Unlock all locks
                            repeat:
                              for_each: !input locks
                              sequence:
                                - action: lock.unlock
                                  target:
                                    entity_id: "{{ repeat.item }}"
                  - alias: Remove itinerary started notification
                    action: "{{ notify_service }}"
                    data:
                      message: clear_notification
                      data:
                        tag: itinerary-status
                  - alias: Stop whole script as successful
                    stop: Successful
                else:
                  - alias: Wait for driver to stop vehicle
                    wait_for_trigger:
                    - trigger: template
                      value_template: "{{ is_state(driving_sensor, 'off') }}"
                  - alias: Remove current itinerary
                    action: input_text.set_value
                    target:
                      entity_id: "{{ itinerary_sensor }}"
                    data:
                      value: none
                  - alias: Remove itinerary started notification
                    action: "{{ notify_service }}"
                    data:
                      message: clear_notification
                      data:
                        tag: itinerary-status
                  - alias: Stop whole script as it ran successfully
                    stop: Successful
  - alias: If both loop were broken, remove current itinerary as driver left vehicle or timed out
    action: input_text.set_value
    data:
      value: none
    target:
      entity_id: "{{ itinerary_sensor }}"
  - alias: If vehicle left in gate zone and travel time was not updated
    if:
      condition: template
      value_template: "{{ is_state(person, [state_attr(gate_location, 'friendly_name'), states[gate_location].object_id])
        and states[travel_time_sensor].last_updated < now() - timedelta(minutes=5) }}"
    then:
      - alias: Notify driver that travel time integration did not respond
        action: "{{ notify_service }}"
        data:
          title: !input itinerary_canceled_title
          message: !input travel_time_did_not_respond
          data:
            car_ui: true
            notification_icon: mdi:alert-circle
            channel: Itinerary status
            importance: high
            push:
              sound:
                name: "default"
                critical: 1
            tag: itinerary-status
            timeout: 300
    else:
      - alias: Send itinerary canceled notification to driver as he left vehicle
        action: "{{ notify_service }}"
        data:
          title: !input itinerary_canceled_title
          message: !input vehicle_left_message
          data:
            car_ui: true
            notification_icon: mdi:alert-circle
            channel: Itinerary status
            importance: high
            push:
              sound:
                name: "default"
                critical: 1
            tag: itinerary-status
            timeout: 300
# Run in parralel to let the automation start with multiple users driving simultaneously
mode: parallel
max: 10
