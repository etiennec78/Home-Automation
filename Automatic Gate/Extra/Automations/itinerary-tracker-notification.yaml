blueprint:
  name: Itinerary tracker notification
  source_url: "https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/Extra/Automations/itinerary-tracker-notification.yaml"
  domain: automation
  author: etiennec78
  description: |-
    # Itinerary tracker notification 📍

    ## Description 📝
    A blueprint that **notifies** all selected users when another one is **driving home**

    ## Key Features 🌟
    * Companion app notifications 🔔
    * Travel time and ETA notification updates 🔁
    * On notification tap custom link 👆
    * Speakers TTS support 🔊
    * Adjustable notifications 💬

    ## More info ℹ️
    * Version : 1.1.0
    * Set up sensors : [click here](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md)
    * Flowchart : [click here](https://miro.com/app/board/uXjVMpH4Tno=/)
    * Github : [click here](https://github.com/etiennec78/Home-Automation/tree/master/Automatic%20Gate/Extra/Automations)
    * Discord : etiennec78
    [!["Buy Me A Coffee"](https://www.buymeacoffee.com/assets/img/custom_images/yellow_img.png)](https://www.buymeacoffee.com/etiennec78)
  homeassistant:
    min_version: 2024.10.0
  input:
    per_person_sensors:
      name: Per person sensors
      icon: mdi:account-multiple
      collapsed: true
      description: ⚠️ Please sort the sensors in the same order as their users
      input:
        persons:
          name: 👤 Users
          description: |-
            Each **user** which should be **tracked** or **notified** when an itinerary is in progress (same order)
          selector:
            entity:
              multiple: true
              filter:
                domain: person
        notify_devices:
          name: 💬 Notify devices
          description: |-
            Each [**device** to **notify**](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md#notify-services-)**
            *Note : Optional*
          default: []
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        driving_sensors:
          name: 🚗 Driving sensors
          description: |-
            Each **[driving sensor](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md#driving-sensors-)** which should trigger the automation (same order)
            *Note : There can be less driving sensors than users to notify. Place users with driving sensors first.*
          selector:
            entity:
              multiple: true
              filter:
                domain: binary_sensor
        travel_time_sensors:
          name: ✈️ Travel time sensors
          description: |-
            Each **[travel time sensor](https://github.com/etiennec78/Home-Automation/blob/master/Automatic%20Gate/sensors.md#travel-time-sensors-%EF%B8%8F)** monitoring each user **time left before arrival** (same order)
            *Note: Optional if "Track travel time" is set to false*
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: sensor
                device_class: duration
    speakers:
      name: Speakers
      icon: mdi:speaker-multiple
      collapsed: true
      input:
        speaker_tts_devices:
          name: 🔊 TTS speakers
          description: |-
            The **home speakers** your want to play a TTS on when someone starts driving
            *Note : Optional*
          default: []
          selector:
            entity:
              multiple: true
              domain: media_player
        speaker_tts_service:
          name: 🎙️ TTS service
          description: |-
            The **TTS service** you want to use for your speakers
            *Note : Optional*
          default: ""
          selector:
            target:
              entity:
                domain: tts

    notification_settings:
      name: Notification settings
      icon: mdi:cog
      collapsed: true
      input:
        notif_refresh_rate:
          name: 🔁 Notification refresh rate
          description: The minimum time between sending two tracking notifications, to avoid quickly reaching the notification quota if your position is updated frequently
          default: 3
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: minutes
        on_tap_link:
          name: 👆 On tap link
          description: |-
            The **link** you will go to if you **tap** on the notification
            *Note : Can be Home Assistant relative links*
          default: "/lovelace/vehicle-tracker-map"
          selector:
            text:
        notify_persons_home:
          name: 🔔🏠 Notify persons home
          description: Should the automation notify persons that are home ?
          default: true
          selector:
            boolean:
        notify_persons_driving:
          name: 🔔🚗 Notify persons driving
          description: Should the automation notify other drivers ?
          default: false
          selector:
            boolean:
        notify_everyone_else:
          name: 🔔🧩 Notify everyone else
          description: Should the automation notify everyone else ?
          default: false
          selector:
            boolean:
        itinerary_started_message:
          name: 💬 Itinerary started notification
          description: |-
            The **content** of the notification or TTS you will receive when someone **begins to drive**
            *Note : {{driver_name}} will be replaced by the drivers' name*
          default: "{{ driver_name }} just got into his car"
          selector:
            text:
        itinerary_ongoing_message:
          name: 💬 Itinerary ongoing notification
          description: |-
            The **content** of the notification you will receive while receiving new **travel time updates**
            *Note : {{driver_name}} will be replaced by the drivers' name and {{arrival}} by its ETA*
          default: "{{ driver_name }} will arrive approximately at {{ arrival }}"
          selector:
            text:
        driver_arrived_message:
          name: 💬 Driver has arrived notification
          description: |-
            The **content** of the notification you will receive when the driver has **arrived**
            *Note : {{driver_name}} will be replaced by the drivers' name*
          default: "{{ driver_name }} just arrived home"
          selector:
            text:

variables:
  persons: !input persons
  notify_devices: !input notify_devices
  driving_sensors: !input driving_sensors
  travel_time_sensors: !input travel_time_sensors
  speaker_tts_devices: !input speaker_tts_devices
  speaker_tts_service: !input speaker_tts_service
  notif_refresh_rate: !input notif_refresh_rate
  notify_persons_home: !input notify_persons_home
  notify_persons_driving: !input notify_persons_driving
  notify_everyone_else: !input notify_everyone_else

triggers:
  - trigger: state
    entity_id: !input driving_sensors
    from: "off"
    to: "on"

conditions: []
  # No condition

actions:
  # Store the list index of the driver, and extract the recurrent sensors at this index of the list
  - variables:
      idx: "{{ driving_sensors.index(trigger.entity_id) }}"
      # without a context.id key, popping an element from the list will be global to all future instances
      notify_services: |-
        {% set data = namespace(devices_list=[]) %}

        {% for notify_idx in range(notify_devices | length) %}
          {% if notify_idx != idx %}
            {% if notify_persons_home and
                    is_state(persons[notify_idx], 'home')
               or notify_persons_driving and
                    is_state(driving_sensors[notify_idx], 'on')
               or notify_everyone_else and
                    not(is_state(persons[notify_idx], 'home') or
                        is_state(driving_sensors[notify_idx], 'on')) %}
              {% set data.devices_list = data.devices_list + [notify_devices[notify_idx]] %}
            {% endif %}
          {% endif %}
        {% endfor %}

        {{ {context.id: data.devices_list | map('device_attr', 'name') | map('slugify') | map('regex_replace', '^', 'notify.mobile_app_') | list} }}

      services_registered: "{{ notify_services[context.id] | length }}"
      driving_sensor: "{{ driving_sensors[idx] }}"
      driver: "{{ persons[idx] }}"
      driver_name: "{{ state_attr(driver, 'friendly_name') }}"

  # Only continue if the driver is not home
  - condition: template
    value_template: "{{ not is_state(driver, 'home') }}"
  # Notify each user except the driver that an itinerary has been started
  - repeat:
      for_each: "{{ notify_services[context.id] }}"
      sequence:
        - action: "{{ repeat.item }}"
          data:
            message: !input itinerary_started_message
            data:
              notification_icon: mdi:car
              tag: itinerary-tracker
              channel: Itinerary status
              sticky: true
              # Hack to retrieve the notification service when dismissed
              confirmation: "{{ repeat.item }}"
              url: !input on_tap_link
              clickAction: !input on_tap_link
              alert_once: true
  # If someone is currently home, and tts devices and service are set
  - if:
      - condition: template
        value_template: |-
          {{ speaker_tts_devices != [] and speaker_tts_service != '' and persons | select('is_state', 'home') | list != [] }}
    then:
      # Play a TTS on each device
      - repeat:
          for_each: "{{ speaker_tts_devices }}"
          sequence:
            - action: tts.speak
              data:
                cache: true
                media_player_entity_id: "{{ repeat.item }}"
                message: !input itinerary_started_message
              target: "{{ speaker_tts_service }}"
  # If travel time sensors are set
  - if:
      condition: template
      value_template: "{{ travel_time_sensors != [] }}"
    then:
      - variables:
          travel_time_sensor: "{{ travel_time_sensors[idx] }}"
      # Repeat while the driver is still driving
      - repeat:
          while:
            - condition: template
              value_template: "{{ is_state(driving_sensor, 'on') }}"
          sequence:
            # Wait for a travel time update or the user to leave his vehicle or a user to clear the notification
            - wait_for_trigger:
                - trigger: event
                  id: travel_time
                  event_type: state_changed
                  event_data:
                    entity_id: "{{ travel_time_sensor }}"
                  # Only send position notifications if this loop doesn't contain a cooldown
                  enabled: "{{ (repeat.index - (services_registered - notify_services[context.id] | length)) % 2 == 1 }}"
                - trigger: template
                  id: vehicle_left
                  value_template: "{{ is_state(driving_sensor, 'off') }}"
                - trigger: event
                  id: notification_cleared
                  event_type: mobile_app_notification_cleared
                  event_data:
                    tag: itinerary-tracker
              timeout:
                # Enable cooldown every other loop, excluding those triggered by events other than position
                minutes: |-
                  {% if (repeat.index - (services_registered - notify_services[context.id] | length)) % 2 == 0 %}
                    {{ notif_refresh_rate }}
                  {% else %}
                    720
                  {% endif %}
            # If an user removed the notification, then stop sending notification updates to his device
            - if:
                condition: template
                value_template: "{{ wait.trigger.id == 'notification_cleared' }}"
              then:
                - variables:
                    removed_service: |-
                      {{ notify_services[context.id].pop(
                          notify_services[context.id].index(
                            wait.trigger.event.data.confirmation)) }}
            # Only continue the loop if the wait_for_trigger was triggered by a travel time update
            - condition: template
              value_template: "{{ wait.trigger.id == 'travel_time' }}"
            # Calculate ETA
            - variables:
                remaining: "{{ state_attr(travel_time_sensor, 'duration') * 60 }}"
                arrival_timestamp: "{{ as_timestamp(now()) + remaining }}"
                arrival: "{{ arrival_timestamp | timestamp_custom('%H:%M') }}"
            # Send an ETA notification update to each user
            - repeat:
                for_each: "{{ notify_services[context.id] }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    data:
                      message: !input itinerary_ongoing_message
                      data:
                        notification_icon: mdi:map-marker-account
                        tag: itinerary-tracker
                        channel: Itinerary status
                        sticky: true
                        # Hack to retrieve the notification service when dismissed
                        confirmation: "{{ repeat.item }}"
                        url: !input on_tap_link
                        clickAction: !input on_tap_link
                        alert_once: true
                        timeout: "{{ remaining | int }}"
                        chronometer: true
                        when: "{{ arrival_timestamp | int }}"
    # If there are no travel time sensors set
    else:
      # Wait for the user to leave his vehicle
      - wait_for_trigger:
          - trigger: template
            id: vehicle_left
            value_template: "{{ is_state(driving_sensor, 'off') }}"
  # If the driver has arrived home
  - if:
      condition: template
      value_template: "{{ is_state(driver, 'home') }}"
    then:
      # Send an arrival notification to each user
      - repeat:
          for_each: "{{ notify_services[context.id] }}"
          sequence:
            - action: "{{ repeat.item }}"
              data:
                message: !input driver_arrived_message
                data:
                  notification_icon: mdi:home-map-marker
                  tag: itinerary-tracker
                  channel: Itinerary status
                  url: !input on_tap_link
                  clickAction: !input on_tap_link
                  timeout: 300
    # If the driver has not arrived home
    else:
      # Remove itinerary notification for each user
      - repeat:
          for_each: "{{ notify_services[context.id] }}"
          sequence:
            - action: "{{ repeat.item }}"
              data:
                message: clear_notification
                data:
                  tag: itinerary-tracker
mode: parallel
