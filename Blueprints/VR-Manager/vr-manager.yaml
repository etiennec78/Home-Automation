blueprint:
  name: VR Manager 🥽
  source_url: "https://github.com/etiennec78/Home-Automation/blob/master/Blueprints/VR-Manager/vr-manager.yaml"
  domain: automation
  author: etiennec78
  description: |-
    # VR Manager 🥽

    ## Description 📝
    A blueprint that sets up the devices in your room to play VR

    <details>
      <summary><h2>Features 🌟</h2></summary>

    * Built-in configuration checker

    When a VR session starts:
    * Confirm the user presence in the room/house
    * Ask the user for a confirmation via a notification
    * Turn on computer
    * Turn on lights for inside-out tracking
    * Launch a PCVR streaming app
    * Send a notification
    * Run custom actions
    * Continuously adapt the lights while playing, thanks to:
      * illuminance sensor
      * sun elevation
      * windows orientation
      * weather

    When the session ends:
    * Restore the lights
    * Turn off computer
    * Run custom actions

    </details>

    ## More Info ℹ️
    * Version: 2.1.0
    * GitHub: [click here](https://github.com/etiennec78/Home-Automation/tree/master/Blueprints/VR-Manager)
    * Discord: @etiennec78
    [![ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/C0C5XVRMM)
  homeassistant:
    min_version: 2026.7.0  # New triggers (eg: illuminance.crossed_threshold)
  input:
    trigger:
      name: Trigger
      icon: mdi:flash
      input:
        start_triggers:
          name: ⚡ Start trigger
          description: |-
            Which **event** must this automation wait for to **start**?
          selector:
            select:
              multiple: true
              options:
                - label: Device trackers
                  value: "trackers"
                - label: Last reboot sensor
                  value: "boot"
                - label: Interactive sensor
                  value: "interactive"
                - label: Charging stopped
                  value: "charge"
        end_triggers:
          name: ⚡ End trigger
          description: |-
            Which **event** must this automation wait for to **stop**?
            > If 'Interactive sensor' and 'Charging started' are selected, the automation will wait for both conditions to be true
          selector:
            select:
              multiple: true
              options:
                - label: Device trackers
                  value: "trackers"
                - label: Interactive sensor
                  value: "interactive"
                - label: Charging started
                  value: "charge"
        hmd_trackers:
          name: 🛜 Headset device trackers
          description: |-
            Your headset **device trackers** (Wi-Fi, BLE) to detect when it is turned **on**
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: device_tracker
        hmd_reboot_sensor:
          name: 🔁 Last reboot sensor
          description: |-
            Will be updated when the **companion app connects** to your HA server after powering up
          default: []
          selector:
            entity:
              filter:
                domain: sensor
                device_class: timestamp
        hmd_interactive_sensor:
          name: 🎮 Headset interactive sensor
          description: |-
            A **binary sensor** reporting whether your headset **screen** is **on**
          default: []
          selector:
            entity:
              filter:
                domain: binary_sensor
        non_interactive_duration:
          name: 🎮 Non-interactive duration
          description: |-
            The time of **non-interactivity** before considering that the vr session is **over**
          default: 30
          selector:
            number:
              min: 0
              max: 300
        charging_sensor:
          name: 🔋 Charging sensor
          description: |-
            A binary sensor reporting when your **device** is **plugged**
          default: []
          selector:
            entity:
              filter:
                domain: binary_sensor
                device_class: plug

    headset:
      name: VR headset
      icon: mdi:virtual-reality
      collapsed: true
      input:
        hmd_device:
          name: 🥽 Headset device
          description: |-
            Your headset companion **app** device to sent it **notifications** or **commands**
          default: ""
          selector:
            device:
              filter:
                integration: mobile_app
        startup_app:
          name: 🚀 Startup app
          description: |-
            The **app** to launch on your VR device when the **automation starts**
            > The input above is required
          default: ""
          selector:
            select:
              custom_value: true
              options:
                - label: Don't start an app
                  value: ""
                - label: ALVR
                  value: alvr.client
                - label: Meta Air Link
                  value: com.oculus.xrstreamingclient
                - label: Meta Remote Desktop (2D)
                  value: com.oculus.remotedesktop
                - label: Steam Link
                  value: com.valvesoftware.steamlinkvr
                - label: Virtual Desktop
                  value: VirtualDesktop.Android
                - label: WiVRn
                  value: org.meumeu.wivrn

    computer:
      name: Computer
      icon: mdi:desktop-tower-monitor
      collapsed: true
      input:
        pc_router_tracker:
          name: 🖥️ PC router device tracker
          description: |-
            Your PC **device tracker** to only turn it on if it was off
          default: ""
          selector:
            entity:
              filter:
                domain: device_tracker
        pc_wol:
          name: 💤 Wake On LAN entity
          description: |-
            An entity to **turn on** your PC when your VR session starts, for **PCVR**
          default: ""
          selector:
            entity:
              filter:
                integration: wake_on_lan
                domain:
                  - button
                  - switch
        turn_off_pc:
          name: 🛑 Turn off PC
          description: |-
            **Turn off** the **PC** at the **end** of the VR session
            > Uses the WoL switch
          default: false
          selector:
            boolean:

    player:
      name: Player
      icon: mdi:account
      collapsed: true
      input:
        player:
          name: 👤 Player
          description: |-
            The **person entity** associated with the VR **player**
          default: ""
          selector:
            entity:
              filter:
                domain: person
        confirm_presence:
          name: 👤 Confirm presence
          description: |-
            **Check** that the **player** is **home** before starting the automation
          default: false
          selector:
            boolean:
        room_tracker:
          name: 🔎 Player room tracker
          description: |-
            Sensor to check that the headset is in a vr room before starting the automation
          default: ""
          selector:
            entity:
              multiple: true
              filter:
                domain: sensor
                device_class: bermuda__custom_device_class
        vr_rooms:
          name: 🔎 VR rooms
          default: []
          selector:
            area:
              multiple: true
        ble_scanner_switches:
          name: 🔎 BLE scanner activator switches
          description: |-
            **[Switches](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md#bluetooth-scanner-switch-)** to automatically **start and stop BLE scanning** when needed
            > *Leave empty if you want your BLE scanners to be always on*
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: switch

    lights:
      name: Lights
      icon: mdi:lightbulb-group
      collapsed: true
      input:
        lights:
          name: 💡 Room lights
          description: |-
            Lights to turn on for headset **inside-out tracking**
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: light
        restore_lights:
          name: 💡 Restore lights state
          description: |-
            **Turn off** the **lights** turned on by this blueprint at the **end** of the vr session
          default: true
          selector:
            boolean:
        light_brightness_pct:
          name: ✨ Light brightness
          default: 20
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        brightest_color:
          name: ✨ Choose brightest color
          description: |-
            Either change the color to a **pure white** RGB color, or use a **kelvin temperature** if the light has a white channel
          default: false
          selector:
            boolean:
        illuminance_sensor:
          name: 🛋️ Room illuminance sensor
          description: |-
            A sensor to turn on the **lights** based on its value
          default: []
          selector:
            entity:
              filter:
                domain: sensor
                device_class: illuminance
        illuminance_trigger:
          name: 🛋️ Room illuminance sensor target
          description: |-
            **Turn on** the lights **below** this illuminance level
          default: 100
          selector:
            number:
              min: 0
              max: 200
              unit_of_measurement: lux
        auto_brightness:
          name: ✨ Automatic brightness
          description: |-
            Uses the **illuminance sensor** value to continuously **adjust** the **light** brightness and get close to the value from the input above
          default: false
          selector:
            boolean:
        sun:
          name: 🔅 Sun
          description: |-
            Take the **sun** into account to **estimate** when to turn on **lights**
          default: ""
          selector:
            entity:
              filter:
                domain: sun
        windows_orientation:
          name: 🔅 Windows orientation
          description: |-
            Take your windows **orientation** into account to **estimate** when to turn on **lights**
            > *-1: Disabled*
            > *0: North*
            > *90: East*
            > *180: South*
            > *270: West*
          default: -1
          selector:
            number:
              min: -1
              max: 365
              unit_of_measurement: °
        weather_entity:
          name: 🔅 Weather entity
          description: |-
            Take the **weather** into account to **estimate** when to turn on **lights**
          default: ""
          selector:
            entity:
              filter:
                domain: weather
        low_light_estimation_trigger:
          name: 🔅 Low light estimation trigger
          description: |-
            If you **don't** have a room **illumination** sensor, this template will try to **guess** a value with other sensors from your room
            > *You don't need this if you have an illuminance sensor set*
          default: |-
            {# CONSTANTS #}
            {# 1.0 - 0.0, lower will turn on sooner #}
            {% set LIGHT_FACTOR_TRIGGER = 0.07 %}

            {# 1.0 - 0.0, lower means more reduction of the final light factor #}
            {% set WINDOW_ANGLE_LT60 = 1.0 %}
            {% set WINDOW_ANGLE_LT90 = 0.6 %}
            {% set WINDOW_ANGLE_GT90 = 0.3 %}
            {% set WEATHER_SUNNY = 1.0 %}
            {% set WEATHER_PARTLY_CLOUDY = 0.7 %}
            {% set WEATHER_CLOUDY = 0.4 %}
            {% set WEATHER_RAINY = 0.2 %}


            {# CODE #}
            {# No need to change anything below #}

            {% set sun_elevation_factor = 1.0 %}
            {% if sun != '' %}
              {% set elevation = state_attr(sun, 'elevation') %}
              {% set sun_elevation_factor = (
                elevation / 90
                if elevation > 0
                else 0
              ) %}
            {% endif %}

            {% set orientation_factor = 1.0 %}
            {% if windows_orientation != -1 and sun != '' %}
              {% set sun_azimuth = state_attr(sun, 'azimuth') %}
              {% set angle_diff = (sun_azimuth - windows_orientation) | abs %}
              {% set angle_diff = angle_diff if angle_diff <= 180 else 360 - angle_diff %}
              {% if angle_diff < 60 %}
                {% set orientation_factor = WINDOW_ANGLE_LT60 %}
              {% elif angle_diff < 90 %}
                {% set orientation_factor = WINDOW_ANGLE_LT90 %}
              {% else %}
                {% set orientation_factor = WINDOW_ANGLE_GT90 %}
              {% endif %}
            {% endif %}

            {% set weather_factor = WEATHER_SUNNY %}
            {% if weather != '' %}
              {% if weather == 'partlycloudy' %}
                {% set weather_factor = WEATHER_PARTLY_CLOUDY %}
              {% elif weather in ['cloudy', 'fog'] %}
                {% set weather_factor = WEATHER_CLOUDY %}
              {%
                elif weather in [
                  'rainy',
                  'pouring',
                  'lightning',
                  'hail',
                  'snowy',
                  'lightning-rainy',
                  'snowy-rainy'
                ]
              %}
                {% set weather_factor = WEATHER_RAINY %}
              {% endif %}
            {% endif %}

            {% set light_factor = sun_elevation_factor * orientation_factor * weather_factor %}
            {{ light_factor > LIGHT_FACTOR_TRIGGER }}
          selector:
            template:

    notifications:
      name: Notification settings
      icon: mdi:bell
      collapsed: true
      input:
        send_notification:
          name: 💬 Send notifications
          default: false
          description: |-
            Send **notifications** to your headset when the automation is **triggered** and **stopped**
          selector:
            boolean:
        start_confirmation:
          name: 👆 Tap to start
          description: |-
            Only **start** the VR Manager if the user has **tapped** the notification in his headset
          default: false
          selector:
            boolean:
        language:
          name: 🌍 Notification language
          description: |-
            The **language** used for **notifications**
            > *If your language is not supported by this blueprint, please [open a pull request](https://github.com/etiennec78/Home-Automation/pulls)*
          default: "en"
          selector:
            language:
              languages:
                - en
                - fr
        custom_translations:
          name: 🈂️ Custom translations
          description: |-
            A **YAML** dictionary to override the default **notification translations**
            > *You can find the translation keys in the `strings['en']` variable in the code, or in your traces*
          default:
            title: {}
            message: {}
            button: {}
          selector:
            object:

    extra_actions:
      name: Extra actions
      icon: mdi:plus-circle
      collapsed: true
      input:
        extra_start:
          name: ➕ On session start
          description: |-
            > Examples: Fan, Wi-Fi priority switch, door lock
          default: []
          selector:
            action:
        extra_end:
          name: ➕ On session end
          description: |-
            > Examples: All of the above, lights
          default: []
          selector:
            action:

    config_checker:
      name: Config checker
      icon: mdi:shield-check
      collapsed: true
      input:
        run_checks_when_enabled:
          name: 🧪 Run tests when blueprint enabled
          description: |-
            Run tests after adding the blueprint or updating inputs
          default: true
          selector:
            boolean:
        run_checks_on_ha_start:
          name: 🧪 Run tests on HA start
          description: |-
            Run tests when Home Assistant finishes starting
          default: true
          selector:
            boolean:

mode: single
max_exceeded: silent

trigger_variables:
  start_triggers: !input start_triggers

triggers:
  - alias: VR headset turns on
    trigger: state
    id: trackers
    entity_id: !input hmd_trackers
    to: home
    from:
      - not_home
      - unavailable
      - unknown
    enabled: "{{ 'trackers' in start_triggers }}"
  - alias: VR headset is interactive
    trigger: state
    id: interactive
    entity_id: !input hmd_interactive_sensor
    to: "on"
    enabled: "{{ 'interactive' in start_triggers }}"
  - alias: VR headset booted up
    trigger: state
    id: boot
    entity_id: !input hmd_reboot_sensor
    enabled: "{{ 'boot' in start_triggers }}"
  - alias: Device stopped charging
    trigger: state
    id: charge
    entity_id: !input charging_sensor
    to: "off"
    enabled: "{{ 'charge' in start_triggers }}"
  - alias: Trigger when the blueprint the user added the blueprint or updated inputs
    trigger: template
    id: blueprint_enabled
    value_template: "{{ is_state(this.entity_id, 'on') }}"
    enabled: !input run_checks_when_enabled
  - alias: Trigger when HA starts
    trigger: homeassistant
    id: ha_started
    event: start
    enabled: !input run_checks_on_ha_start

variables:
  MAX_INT: 2147483647
  BLE_TIMEOUT: 30
  NOTIF_RETRY_TIMER: 7
  MAX_NOTIF_TRIES: 25
  LIGHT_START_TRANSITION: 1
  LIGHT_RESTORE_TRANSITION: 3
  AUTO_BRIGHTNESS_STEP: 10
  hmd_device: !input hmd_device
  hmd_trackers: !input hmd_trackers
  hmd_interactive_sensor: !input hmd_interactive_sensor
  start_triggers: !input start_triggers
  end_triggers: !input end_triggers
  charging_sensor: !input charging_sensor
  startup_app: !input startup_app
  pc_router_tracker: !input pc_router_tracker
  pc_wol: !input pc_wol
  turn_off_pc: !input turn_off_pc
  player: !input player
  confirm_presence: !input confirm_presence
  room_tracker: !input room_tracker
  vr_rooms: !input vr_rooms
  ble_scanner_switches: !input ble_scanner_switches
  restore_lights: !input restore_lights
  sun: !input sun
  windows_orientation: !input windows_orientation
  weather_entity: !input weather_entity
  illuminance_sensor: !input illuminance_sensor
  illuminance_trigger: !input illuminance_trigger
  auto_brightness: !input auto_brightness
  light_brightness_pct: !input light_brightness_pct
  send_notification: !input send_notification
  start_confirmation: !input start_confirmation
  language: !input language
  custom_translations: !input custom_translations
  notify_service: >-
    {{
      none if hmd_device == ''
      else (
        device_attr(hmd_device, 'name')
        | slugify
        | regex_replace('^', 'notify.mobile_app_')
      )
    }}
  ios_device: >-
    {{
      false if notify_service is none
      else device_attr(hmd_device, 'manufacturer') == 'Apple'
    }}
  notif_tag: "vr-manager-{{ this.context.id }}"
  blueprint_name: "{{ state_attr(this.entity_id, 'friendly_name') }}"
  start_order_id: "{{ 'start_order_' ~ this.context.id }}"
  strings:
    en:
      title:
        valid_config: "{{blueprint_name}}: Valid configuration 🛠️✅"
        invalid_config: "{{blueprint_name}}: Invalid configuration 🛠️❌"
      message:
        request: "Start your VR setup?"
        starting: "Setting up your VR setup"
        stopping: "Restoring your VR setup"
        valid_config: "Your configuration seems valid"
        more_info: "More info"
        invalid_translations: |-
          Your custom translations are not valid
          Check the following keys: '{data}' (#1)
        missing_player_entity: "You are missing a player entity (#30)"
        missing_room_data: "You room tracker config is incomplete (#31)"
        wol_no_off_support: "Your Wake on LAN entity cannot turn off your computer (#32)"
        missing_device: "You are missing a VR headset device to send notifications (#33)"
        missing_trigger_entity: "You are missing an entity for your selected trigger (#34)"
        missing_illuminance_sensor: "You are missing an illuminance sensor (#35)"
        missing_sun: "You are missing a sun entity (#36)"
      button:
        start: "Start"
    fr:
      title:
        valid_config: "{{blueprint_name}}: Configuration valide 🛠️✅"
        invalid_config: "{{blueprint_name}}: Configuration invalide 🛠️❌"
      message:
        request: "Démarrer le setup VR ?"
        starting: "Mise en place du setup VR"
        stopping: "Restoration du setup VR"
        valid_config: "Votre configuration semble valide"
        more_info: "Plus d'infos"
        invalid_translations: |-
          Vos traductions personnalisées ne sont pas valides
          Vérifiez les valeurs suivantes: '{data}' (#1)
        missing_player_entity: "Il vous manque une entité pour le joueur (#30)"
        missing_room_data: "Votre configuration de présence dans la salle de jeu est invalide (#31)"
        wol_no_off_support: "Votre entité de Wake on LAN ne peut pas éteindre votre pc (#32)"
        missing_device: "Il vous manque l'appareil de votre casque VR pour pouvoir envoyer des notifications (#33)"
        missing_trigger_entity: "Il vous manque une entité pour le déclencheur que vous avez sélectionné (#34)"
        missing_illuminance_sensor: "Il vous manque un capteur de luminosité ambiante (#35)"
        missing_sun: "Il vous manque une entité de soleil (#36)"
      button:
        start: "Démarrer"

actions:
  - alias: Check that custom strings are valid
    variables:
      custom_translations_error: "{{ custom_translations is not mapping }}"
  - alias: If the custom translations is not a mapping
    if:
      - condition: template
        value_template: "{{ custom_translations_error }}"
    then:
      - alias: Reset the custom translations
        variables:
          custom_translations: {}
  - alias: If the config checker should run checks
    if:
      - condition: or
        conditions:
          - alias: If the blueprint was executed manually
            condition: template
            value_template: "{{ trigger.platform is none }}"
          - alias: If the user added the blueprint, updated inputs, or HA started
            condition: trigger
            id:
              - blueprint_enabled
              - ha_started
    then:
      ##################
      # ERROR CHECKING #
      ##################

      - alias: Initialize variables for the error checker
        variables:
          successful_check: false
          messages: []
          config_checker_tag: "{{ 'config-checker-' ~ this.attributes.id }}"
      - alias: Run the error checker in an error-safe sequence
        sequence:
          - alias: Check for errors
            repeat:
              for_each:
                - alias: Check custom translations
                  error: >-
                    {% set data = namespace(invalid=[]) %}
                    {% for key, sub_items in custom_translations.items() %}
                      {% if key not in strings['en'] %}
                        {% set data.invalid = data.invalid + [key] %}
                      {% else %}
                        {% for subkey, value in sub_items.items() %}
                          {%
                            if value is not string
                            or subkey not in strings['en'][key]
                          %}
                            {% set data.invalid = data.invalid + [subkey] %}
                          {% endif %}
                        {% endfor %}
                      {% endif %}
                    {% endfor %}
                    {{ data.invalid }}
                  message_id: "invalid_translations"
                - alias: Check that a person entity has been given if confirm_presence is true
                  error: "{{ confirm_presence and player == '' }}"
                  message_id: "missing_player_entity"
                - alias: Check that the room tracker and vr rooms inputs have neither or both been filled
                  error: "{{ (vr_rooms == []) != (room_tracker == '') }}"
                  message_id: "missing_room_data"
                - alias: Check that the WoL entity is a switch if turn_off_pc is on
                  error: >-
                    {{
                      turn_off_pc and (
                        pc_wol == ''
                        or (
                          states[pc_wol]
                          | attr('domain')
                          | default('')
                          != 'switch'
                        )
                      )
                    }}
                  message_id: "wol_no_off_support"
                - alias: Check that a device has been given to receive notifications
                  error: >-
                    {{
                      hmd_device == '' and (
                        send_notification or start_confirmation or startup_app != ''
                      )
                    }}
                  message_id: "missing_device"
                - alias: Check that there is an entity for the trigger
                  error: >-
                    {% set triggers = start_triggers | union(end_triggers) %}
                    {{
                      'tracker' in triggers and hmd_trackers == []
                      or 'interactive' in triggers and hmd_interactive_sensor == []
                      or 'charge' in triggers and charging_sensor == []
                    }}
                  message_id: "missing_trigger_entity"
                - alias: Check that there is an illuminance sensor if auto brightness is on
                  error: "{{ auto_brightness and illuminance_sensor == [] }}"
                  message_id: "missing_illuminance_sensor"
                - alias: Check that a sun entity has been given if there is a windows orientation value
                  error: "{{ windows_orientation != -1 and sun == [] }}"
                  message_id: "missing_sun"
              sequence:
                - alias: If a check failed
                  if:
                    - condition: template
                      value_template: >-
                        {% set error = repeat.item.error %}
                        {{ error != [] if error is list else error }}
                  then:
                    - alias: Get notification translation
                      variables:
                        message_id: "{{ repeat.item.message_id }}"
                        message: &get_message >-
                          {# Custom translation #}
                          {%
                            if 'message' in custom_translations
                            and message_id in custom_translations['message']
                          %}
                            {{ custom_translations['message'][message_id] }}

                          {# Selected language #}
                          {% elif message_id in strings[language]['message'] %}
                            {{ strings[language]['message'][message_id] }}

                          {# Fallback to english #}
                          {% else %}
                            {{ strings['en']['message'][message_id] }}
                          {% endif %}
                    - alias: If the error variable contains a list
                      if:
                        - condition: template
                          value_template: "{{ repeat.item.error is list }}"
                      then:
                        - alias: Format the string with error data
                          variables:
                            message: >-
                              {{
                                message.format(
                                  data=(
                                    ', '.join(repeat.item.error)
                                  )
                                )
                              }}
                    - alias: Append the error message to the list
                      variables:
                        messages: "{{ messages | union([message]) }}"
          - alias: If the config is valid
            if:
              - condition: template
                value_template: "{{ messages | length == 0 }}"
            then:
              - alias: If the blueprint was triggered manually
                if:
                  - condition: template
                    value_template: "{{ trigger.platform is none }}"
                then:
                  - alias: Set message ids
                    variables:
                      title_id: "valid_config"
                      message_id: "valid_config"
                  - alias: Get notification translation
                    variables:
                      message: *get_message
                      title: &get_title >-
                        {# Custom translation #}
                        {%
                          if 'title' in custom_translations
                          and title_id in custom_translations['title']
                        %}
                          {{ custom_translations['title'][title_id] }}

                        {# Selected language #}
                        {% elif title_id in strings[language]['title'] %}
                          {{ strings[language]['title'][title_id] }}

                        {# Fallback to english #}
                        {% else %}
                          {{ strings['en']['title'][title_id] }}
                        {% endif %}
                  - alias: Notify all users on the dashboard that the config is valid
                    action: persistent_notification.create
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
                      notification_id: "{{ config_checker_tag }}"
                    continue_on_error: true
                else:
                  - alias: Remove the previous dashboard notification
                    action: persistent_notification.dismiss
                    data:
                      notification_id: "{{ config_checker_tag }}"
                    continue_on_error: true
            else:
              - alias: Build the notification
                variables:
                  title_id: "invalid_config"
                  title: *get_title
                  message: "{{ '• ' ~ '\n• '.join(messages) }}"
              - alias: Build the more info link
                variables:
                  message_id: "more_info"
                  more_info: *get_message
                  link: "https://github.com/etiennec78/Home-Automation/tree/master/Blueprints/README.md#error-codes-table-%EF%B8%8F"
                  more_info_md: "[{{more_info}}]({{link}})"
              - alias: Notify all users on the dashboard that the config is invalid
                action: persistent_notification.create
                data:
                  title: "{{ title }}"
                  message: "{{ message ~ '\n\n' ~ more_info_md }}"
                  notification_id: "{{ config_checker_tag }}"
                continue_on_error: true
          - alias: Confirm that no error occured while the config checker was running
            variables:
              successful_check: true
        continue_on_error: true
      - alias: If an error occured while the config checker was running
        if:
          - condition: template
            value_template: "{{ not successful_check }}"
        then:
          - alias: Build notification
            variables:
              title_id: "invalid_config"
              message_id: "something_went_wrong"
              title: *get_title
              message: *get_message
          - alias: Notify all users on the dashboard that an error occured
            action: persistent_notification.create
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              notification_id: "{{ config_checker_tag }}"
            continue_on_error: true
          - stop: Config checker failed
            error: true

  - alias: Only continue if the blueprint was triggered normally
    condition: template
    value_template: >-
      {{
        trigger.platform is not none
        and trigger.id in start_triggers
      }}
  - alias: Only continue if the user is home
    condition: template
    value_template: "{{ is_state(player, 'home') }}"
    enabled: !input confirm_presence

  - alias: If the automation should check that the user is in the vr room
    if:
      - condition: template
        value_template: "{{ room_tracker != '' }}"
    then:
      - variables:
          ble_scanners_to_manage: >-
            {%
              if ble_scanner_switches == []
              or is_state(room_tracker, vr_rooms)
            %}
              {{ [] }}
            {% else %}
              {{
                ble_scanner_switches
                | select('is_state', 'off')
                | list
              }}
            {% endif %}
      - alias: Turn on BLE scanner to manage
        action: switch.turn_on
        target:
          entity_id: "{{ ble_scanners_to_manage }}"
        continue_on_error: true
      - alias: Confirm the user presence in the room before starting
        wait_template: "{{ is_state(room_tracker, vr_rooms) }}"
        timeout: "{{ BLE_TIMEOUT }}"
      - alias: Turn off managed BLE scanners
        action: switch.turn_off
        target:
          entity_id: "{{ ble_scanners_to_manage }}"
        continue_on_error: true
      - alias: If the player is not in his room
        if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - stop: Player not in room
  - variables:
      pc_managed: false
      wait_notif_ack: false
      wait_hmd_sign: false
      wait_charging_and_interactive: >-
        {{
          'charge' in end_triggers
          and 'interactive' in end_triggers
        }}
      next_weather_ts: 0
      webhook_id: "vr-manager-{{ this.context.id }}-start"
      webhook_url: "/api/webhook/{{ webhook_id }}"
      brightness_target: "{{ light_brightness_pct / 100 * 255 }}"
  - variables:
      illuminance_diff: "{{ max(illuminance_sensor_value / 5, 10) }}"
      illuminance_min: "{{ illuminance_sensor_value - illuminance_diff }}"
      illuminance_max: "{{ illuminance_sensor_value + illuminance_diff }}"
    enabled: !input auto_brightness
  - alias: Skip this sequence once if a confirmation from the user is needed
    repeat:
      count: "{{ 2 if start_confirmation else 1 }}"
      sequence:
        - variables:
            confirmed: "{{ not start_confirmation or repeat.index > 1 }}"
            notifs_to_send: []
        - alias: Skip this sequence once if the user has not confirmed that he wanted the automation to run
          if:
            - condition: template
              value_template: "{{ confirmed }}"
          then:
            - alias: If the PC is off
              if:
                - condition: template
                  value_template: >-
                    {{
                      pc_router_tracker ~ pc_wol == ''
                      or pc_router_tracker != ''
                        and is_state(pc_router_tracker, 'not_home')
                      or pc_wol != ''
                        and is_state(pc_wol, 'off')
                    }}
              then:
                - alias: Turn on PC
                  action: homeassistant.turn_on
                  target:
                    entity_id: !input pc_wol
                - variables:
                    pc_managed: true
            - variables:
                restore_light_data: {}
                manually_set_lights: []
              enabled: !input restore_lights
            - alias: Extra action on session start
              sequence: !input extra_start
              continue_on_error: true
            - alias: If an app needs to be opened
              if:
                - condition: template
                  value_template: "{{ startup_app != '' and notify_service is not none }}"
              then:
                - alias: Plan the app opening
                  variables:
                    new_notif_data:
                      message: "command_launch_app"
                      data:
                        package_name: "{{ startup_app }}"
                    notifs_to_send: &append_notif "{{ notifs_to_send + [new_notif_data] }}"
        - alias: If a notification must be sent
          if:
            - condition: or
              conditions:
                - condition: template
                  value_template: !input send_notification
                - condition: template
                  value_template: "{{ not confirmed }}"
            - condition: template
              value_template: "{{ notify_service is not none }}"
          then:
            - alias: Get the notification
              variables:
                title: "{{ blueprint_name }}"
                message_id: "{{ 'starting' if confirmed else 'request' }}"
                message: *get_message
                message_data: "{{ {'notification_icon': 'mdi:virtual-reality'} }}"
            - alias: If a button needs to be added to the notification
              if:
                - condition: template
                  value_template: "{{ not confirmed }}"
              then:
                - alias: Get the button translation
                  variables:
                    button_id: "start"
                    button: >-
                      {# Custom translation #}
                      {%
                        if 'button' in custom_translations
                        and button_id in custom_translations['button']
                      %}
                        {{ custom_translations['button'][button_id] }}

                      {# Selected language #}
                      {% elif button_id in strings[language]['button'] %}
                        {{ strings[language]['button'][button_id] }}

                      {# Fallback to english #}
                      {% else %}
                        {{ strings['en']['button'][button_id] }}
                      {% endif %}
                    url_key: "{{ 'url' if ios_device else 'clickAction' }}"
                    message_data: >-
                      {{
                        message_data | union({
                          'actions': [{
                            'action': start_order_id,
                            'title': button,
                            'icon': 'sfsymbols:play',
                            url_key: webhook_url
                          }]
                        })
                      }}
            - alias: Plan a notification to inform of the start, or ask for a confirmation
              variables:
                new_notif_data:
                  title: "{{ title }}"
                  message: "{{ message }}"
                  data: "{{ message_data }}"
                notifs_to_send: *append_notif
        - alias: Initialize variables
          variables:
            supports_ack: >-
              {{
                not ios_device
                and notify_service is not none
                and confirmed
              }}
            notif_rounds: 0
            notif_id: 0
            hmd_showed_sign: false
            weather: "{{ '' if weather_entity == '' else states(weather_entity) }}"
        - alias: If the weather entity support hourly reports
          if:
            - condition: template
              value_template: >-
                {{
                  weather_entity != ''
                  and (
                    state_attr(gate, 'supported_features')
                    | bitwise_and(2) == 1
                  )
                }}
          then:
            - action: weather.get_forecasts
              target:
                entity_id: "{{ weather_entity }}"
              data:
                type: hourly
              response_variable: weather_forecast
            - variables:
                weather_forecast: >-
                  {{ weather_forecast[weather_entity]['forecast'] }}
                weather_idx: 0
            - variables: &weather_data
                weather: >-
                  {% set data = weather_forecast %}
                  {%
                    if data | length > weather_idx
                    and 'condition' in data[weather_idx]
                  %}
                    {{ data[0]['condition'] }}
                  {% endif %}
                next_weather_ts: >-
                  {% set data = weather_forecast %}
                  {% set next = weather_idx + 1 %}
                  {%
                    if data | length > next
                    and 'datetime' in data[next]
                  %}
                    {{ data[next]['datetime'] | as_timestamp }}
                  {% else %}
                    {{ 0 }}
                  {% endif %}
        - alias: Trigger a light condition check then send the notifications without waiting
          variables:
            turn_on_lights: !input low_light_estimation_trigger
            wait: >-
              {% if turn_on_lights %}
                {{ {'completed': true, 'trigger': {'id': 'condition_changed'}} }}
              {% else %}
                {{ none }}
              {% endif %}
            last_notif_ts: 0
        - alias: Repeat until the user has stopped his headset
          repeat:
            until: >-
              {{
                wait.completed and (
                  wait.trigger.id in end_triggers
                  or (
                    wait.trigger.id == 'start_order'
                    and not confirmed
                  )
                )
              }}
            sequence:
              - note: >-
                  We check for events before waiting for them,
                  as we are forcing a condition_changed on first loop to start the lights
                choose:
                  - alias: If this is the first loop and no trigger was planned, do nothing
                    conditions:
                      - condition: template
                        value_template: "{{ wait is none }}"
                    sequence:
                  - alias: If notifications should be sent
                    conditions:
                      - condition: template
                        value_template: >-
                          {{
                            not wait.completed
                            or wait.trigger.id in ['notif_ack', 'hmd_sign']
                          }}
                    sequence:
                      - choose:
                          - alias: If the ack was received
                            conditions:
                              - condition: template
                                value_template: "{{ wait.completed and wait.trigger.id == 'notif_ack' }}"
                            sequence:
                              - variables:
                                  wait_notif_ack: false
                              - variables: &notification_received_variables
                                  notifs_to_send: "{{ notifs_to_send[1:] }}"
                                  notif_id: "{{ notif_id + 1 }}"
                          - alias: If the hmd showed a sign
                            conditions:
                              - condition: template
                                value_template: "{{ wait.completed and wait.trigger.id == 'hmd_sign' }}"
                            sequence:
                              - variables:
                                  hmd_showed_sign: true
                      - variables:
                          notif_failed: false
                          last_notif_ts: "{{ now() | as_timestamp }}"
                      - alias: For each notification to send, until one fails or if the device supports ack
                        note: >-
                          If the device supports ack,
                          we return to the wait_for_trigger and wait for the ack
                          before sending the next notification
                        repeat:
                          while: "{{ notifs_to_send | length > 0 and not wait_notif_ack and not notif_failed }}"
                          sequence:
                            - variables:
                                notif_failed: true
                            - alias: Error safe sequence
                              sequence:
                                - alias: Send the notification
                                  action: "{{ notify_service }}"
                                  data: >-
                                    {{
                                      notifs_to_send[0]
                                      | combine(
                                        {
                                          'data': {
                                            'tag': notif_tag ~ '-' ~ notif_id,
                                            'channel': 'VR Manager',
                                            'confirmation': not ios_device
                                          }
                                        },
                                        recursive=True
                                      )
                                    }}
                                - variables:
                                    notif_failed: false
                                - alias: If the device supports ack
                                  if:
                                    - condition: template
                                      value_template: "{{ supports_ack }}"
                                  then:
                                    - variables:
                                        wait_notif_ack: "{{ supports_ack }}"
                                  else:
                                    - variables: *notification_received_variables
                              continue_on_error: true
                      - alias: If the last notification failed
                        if:
                          - condition: template
                            value_template: "{{ notif_failed }}"
                        then:
                          - variables:
                              notif_rounds: "{{ notif_rounds + 1 }}"
                              wait_hmd_sign: "{{ not hmd_showed_sign and hmd_device != '' }}"
                          - alias: Stop sending notifications after too many tries
                            if:
                              - condition: template
                                value_template: "{{ notif_rounds >= MAX_NOTIF_TRIES }}"
                            then:
                              - variables:
                                  notifs_to_send: []
                        else:
                          - variables:
                              wait_hmd_sign: false
                  - alias: If the weather has been updated
                    conditions:
                      - condition: template
                        value_template: "{{ not wait.completed and timeout_type == 'weather' }}"
                    sequence:
                      - alias: If the forecast needs to be updated
                        if:
                          - condition: template
                            value_template: "{{ weather_forecast | length > weather_idx + 1 }}"
                        then:
                          - action: weather.get_forecasts
                            target:
                              entity_id: "{{ weather_entity }}"
                            data:
                              type: hourly
                            response_variable: weather_forecast
                          - variables:
                              weather_forecast: >-
                                {{ weather_forecast[weather_entity]['forecast'] }}
                              weather_idx: 0
                        else:
                          - variables:
                              weather_idx: "{{ weather_idx + 1 }}"
                      - variables: *weather_data
                  - alias: If a light condition changed
                    conditions:
                      - condition: template
                        value_template: "{{ wait.trigger.id == 'condition_changed' }}"
                    sequence:
                      - repeat:
                          for_each: !input lights
                          sequence:
                            - alias: Only continue if the light was not set manually
                              condition: template
                              value_template: "{{ repeat.item not in manually_set_lights }}"
                            - variables:
                                brightness_target: "{{ light_brightness_pct / 100 * 255 }}"
                                light_data: >-
                                  {# Transition #}
                                  {% set data = {'transition': LIGHT_START_TRANSITION} %}

                                  {# Brightness #}
                                  {% set brightness = state_attr(repeat.item, 'brightness') %}
                                  {% if not is_number(brightness) or brightness < brightness_target %}
                                    {% set data = data | combine({'brightness': brightness_target}) %}
                                  {% endif %}

                                  {{ data }}
                            - variables:
                                light_data: >-
                                  {% set data = light_data %}
                                  {% set color_modes = state_attr(repeat.item, 'supported_color_modes') %}

                                  {# Color temperature light #}
                                  {% if 'color_temp' in color_modes %}
                                    {% set max = state_attr(repeat.item, 'max_color_temp_kelvin') %}
                                    {% if max is not none %}
                                      {% set min = state_attr(repeat.item, 'min_color_temp_kelvin') %}
                                      {% if min is not none %}
                                        {% set temp = average(min, max) %}
                                      {% else %}
                                        {% set temp = max %}
                                      {% endif %}
                                    {% else %}
                                      {% set temp = 4000 %}
                                    {% endif %}
                                    {% set data = data | combine({'color_temp_kelvin': temp}) %}

                                  {# RGB light #}
                                  {% elif 'rgb' in color_modes %}
                                    {% set data = data | combine({rgb_color: [255, 255, 255]}) %}
                                  {% endif %}

                                  {{ data }}
                              enabled: !input brightest_color
                            - alias: Continue if the color is different from the one requested or is dimmer
                              condition: template
                              value_template: >-
                                {% set different = false %}
                                {% for attr in light_data %}
                                  {% set attr_value = light_data[attr] %}
                                  {% if not is_state_attr(repeat.item, attr, attr_value) %}
                                    {% set different = true %}
                                    {% break %}
                                  {% endif %}
                                {% endfor %}
                                {{ different }}
                            - alias: Remember this light state
                              variables:
                                restore_light_data: >-
                                  {% set state_obj = states[repeat.item] %}
                                  {% set clean_attrs = state_obj.attributes | to_json | from_json %}
                                  {{
                                    restore_light_data
                                    | combine(
                                      {
                                        repeat.item: dict(clean_attrs, state=state_obj.state)
                                      }
                                    )
                                  }}
                              enabled: !input restore_lights
                            - alias: Turn on light
                              action: light.turn_on
                              target:
                                entity_id: "{{ repeat.item }}"
                              data: "{{ light_data }}"
                  - alias: If a light condition changed
                    conditions:
                      - condition: template
                        value_template: "{{ wait.trigger.id == 'condition_changed' }}"
                    sequence:
                      - repeat:
                          for_each: !input lights
                          sequence:
                            - alias: Only continue if the light was not set manually
                              condition: template
                              value_template: "{{ repeat.item not in manually_set_lights }}"
                            - variables:
                                brightness_target: "{{ light_brightness_pct / 100 * 255 }}"
                                light_data: >-
                                  {# Transition #}
                                  {% set data = {'transition': LIGHT_START_TRANSITION} %}

                                  {# Brightness #}
                                  {% set brightness = state_attr(repeat.item, 'brightness') %}
                                  {% if not is_number(brightness) or brightness < brightness_target %}
                                    {% set data = data | combine({'brightness': brightness_target}) %}
                                  {% endif %}

                                  {{ data }}
                            - variables:
                                light_data: >-
                                  {% set data = light_data %}
                                  {% set color_modes = state_attr(repeat.item, 'supported_color_modes') %}

                                  {# Color temperature light #}
                                  {% if 'color_temp' in color_modes %}
                                    {% set max = state_attr(repeat.item, 'max_color_temp_kelvin') %}
                                    {% if max is not none %}
                                      {% set min = state_attr(repeat.item, 'min_color_temp_kelvin') %}
                                      {% if min is not none %}
                                        {% set temp = average(min, max) %}
                                      {% else %}
                                        {% set temp = max %}
                                      {% endif %}
                                    {% else %}
                                      {% set temp = 4000 %}
                                    {% endif %}
                                    {% set data = data | combine({'color_temp_kelvin': temp}) %}

                                  {# RGB light #}
                                  {% elif 'rgb' in color_modes %}
                                    {% set data = data | combine({rgb_color: [255, 255, 255]}) %}
                                  {% endif %}

                                  {{ data }}
                              enabled: !input brightest_color
                            - alias: Continue if the color is different from the one requested or is dimmer
                              condition: template
                              value_template: >-
                                {% set different = false %}
                                {% for attr in light_data %}
                                  {% set attr_value = light_data[attr] %}
                                  {% if not is_state_attr(repeat.item, attr, attr_value) %}
                                    {% set different = true %}
                                    {% break %}
                                  {% endif %}
                                {% endfor %}
                                {{ different }}
                            - alias: Remember this light state
                              variables:
                                restore_light_data: >-
                                  {% set state_obj = states[repeat.item] %}
                                  {% set clean_attrs = state_obj.attributes | to_json | from_json %}
                                  {{
                                    restore_light_data
                                    | combine(
                                      {
                                        repeat.item: dict(clean_attrs, state=state_obj.state)
                                      }
                                    )
                                  }}
                              enabled: !input restore_lights
                            - alias: Turn on light
                              action: light.turn_on
                              target:
                                entity_id: "{{ repeat.item }}"
                              data: "{{ light_data }}"
                  - alias: If a light state changed
                    conditions:
                      - condition: template
                        value_template: "{{ wait.trigger.id == 'light_state' }}"
                    sequence:
                      - alias: Remove this light from the restore list
                        variables:
                          restore_light_data: >-
                            {% set data = namespace(filtered={}) %}
                            {% for key, value in restore_light_data | items %}
                              {% if key != wait.trigger.entity_id %}
                                {% set data.filtered = data.filtered | combine({key: value}) %}
                              {% endif %}
                            {% endfor %}
                            {{ data.filtered }}
                          manually_set_lights: "{{ manually_set_lights | union([wait.trigger.entity_id]) }}"
                  - alias: If the automatic brightness must be re-evaluated
                    conditions:
                      - condition: template
                        value_template: "{{ wait.trigger.id == 'auto_brightness' }}"
                    sequence:
                      - choose:
                          - alias: If the brightness should go up
                            conditions:
                              - condition: template
                                value_template: >-
                                  {{
                                    states(illuminance_sensor) | is_number
                                    and states(illuminance_sensor) < illuminance_min
                                  }}
                              - condition: template
                                value_template: "{{ brightness_target < 255 }}"
                            sequence:
                              - variables:
                                  brightness_target: "{{ max(brightness_target + AUTO_BRIGHTNESS_STEP, 255) }}"
                          - alias: If the brightness should go down
                            conditions:
                              - condition: template
                                value_template: >-
                                  {{
                                    states(illuminance_sensor) | is_number
                                    and states(illuminance_sensor) > illuminance_max
                                  }}
                              - condition: template
                                value_template: "{{ brightness_target > 0 }}"
                            sequence:
                              - variables:
                                  brightness_target: "{{ min(brightness_target - AUTO_BRIGHTNESS_STEP, 0) }}"
                      - variables:
                          lights_to_update: "{{ restore_light_data.keys() }}"
                      - alias: Only continue if the brightness value has changed
                        condition: template
                        value_template: >-
                          {{
                            lights_to_update | length > 0
                            and not is_state_attr(
                              lights_to_update | first,
                              'brightness',
                              brightness_target
                            )
                          }}
                      - alias: Change the brightness of the lights
                        service: light.turn_on
                        target:
                          entity_id: "{{ lights_to_update }}"
                        data:
                          brightness: "{{ brightness_target }}"
                          transition: "{{ LIGHT_RESTORE_TRANSITION }}"
              - variables:
                  wait_start: "{{ now() }}"
                  timeouts:
                    notif: >-
                      {% if notifs_to_send | length > 0 %}
                        {{
                          last_notif_ts
                          - now() | as_timestamp
                          + NOTIF_RETRY_TIMER
                        }}
                      {% else %}
                        {{ MAX_INT }}
                      {% endif %}
                    weather: >-
                      {% set next_weather = (
                        next_weather_ts
                        - now() | as_timestamp
                      ) %}
                      {% if next_weather > 0 %}
                        {{ next_weather }}
                      {% else %}
                        {{ MAX_INT }}
                      {% endif %}
                  timeout_type: >-
                    {{
                      timeouts
                      | items
                      | sort(attribute='1')
                      | first
                      | first
                    }}
                  timeout: "{{ max(timeouts[timeout_type], 0) }}"
              - wait_for_trigger:
                  - alias: Wait for VR headset to turn off
                    trigger: state
                    id: trackers
                    entity_id: !input hmd_trackers
                    to:
                      - not_home
                      - unknown
                    from: home
                    enabled: "{{ 'trackers' in end_triggers }}"
                  - alias: Wait for VR headset to no longer be worn
                    trigger: state
                    id: interactive
                    entity_id: !input hmd_interactive_sensor
                    to: "off"
                    for: !input non_interactive_duration
                    enabled: "{{ 'interactive' in end_triggers }}"
                  - alias: Wait for the VR headset to be plugged
                    trigger: state
                    id: charge
                    entity_id: !input charging_sensor
                    to: "on"
                    enabled: "{{ 'charge' in end_triggers }}"
                  - alias: Notification received
                    trigger: event
                    id: notif_ack
                    event_type: mobile_app_notification_received
                    event_data:
                      tag: "{{ notif_tag }}-{{ notif_id }}"
                    enabled: "{{ wait_notif_ack }}"
                  - alias: Wait for a sign from the headset if the last notification was not received
                    trigger: template
                    id: hmd_sign
                    value_template: >-
                      {{
                        expand(device_entities(hmd_device))
                        | selectattr('last_updated', '>', wait_start | as_datetime)
                        | list
                        | length
                        > 0
                      }}
                    enabled: "{{ wait_hmd_sign }}"
                  - alias: Start button pressed
                    trigger: event
                    id: start_order
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ start_order_id }}"
                    enabled: "{{ not confirmed }}"
                  - alias: Wait for the notification to be tapped
                    trigger: webhook
                    id: start_order
                    allowed_methods: GET
                    local_only: false
                    webhook_id: "{{ webhook_id }}"
                    enabled: "{{ not confirmed }}"
                  - alias: Light state changed
                    trigger: state
                    id: light_state
                    entity_id: !input lights
                    enabled: "{{ confirmed and restore_lights }}"
                  - alias: Simulated room illuminance fell too low
                    trigger: template
                    id: condition_changed
                    value_template: !input low_light_estimation_trigger
                    enabled: "{{ confirmed and illuminance_sensor == [] }}"
                  - alias: Room illuminance fell too low
                    trigger: illuminance.crossed_threshold
                    id: condition_changed
                    target:
                      entity_id: !input illuminance_sensor
                    options:
                      threshold:
                        type: below
                        value:
                          active_choice: number
                          number: !input illuminance_trigger
                    enabled: "{{ confirmed }}"
                  - alias: The light sensor updated (auto brightness)
                    trigger: state
                    id: auto_brightness
                    entity_id: !input illuminance_sensor
                    enabled: >-
                      {{
                        confirmed
                        and auto_brightness
                        and restore_light_data.keys() | length > 0
                      }}
                timeout: "{{ timeout }}"
              - alias: Only continue if a second end trigger must be awaited
                condition: template
                value_template: >-
                  {{
                    wait_charging_and_interactive
                    and wait.completed
                    and wait.trigger.id in [
                      'charge',
                      'interactive'
                    ]
                  }}
              - variables:
                  wait_charging_and_interactive: false
        - alias: Restart the loop if the start notification button was pressed
          condition: template
          value_template: "{{ wait.trigger.id != 'start_order' }}"
        - alias: If a notification must be sent
          if:
            - condition: template
              value_template: "{{ notify_service is not none }}"
            - condition: template
              value_template: "{{ confirmed }}"
          enabled: !input send_notification
          then:
            - alias: Get the notification
              variables:
                title: "{{ blueprint_name }}"
                message_id: "stopping"
                message: *get_message
            - alias: Notify that the VR setup is being restored
              action: "{{ notify_service }}"
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                data:
                  notification_icon: mdi:virtual-reality
                  channel: VR Manager
                  tag: "{{ notif_tag }}-end"
              continue_on_error: true
  - alias: Don't restore anything if the button was never pressed
    condition: template
    value_template: "{{ confirmed }}"
  - alias: Restore lights
    action: scene.apply
    data:
      entities: "{{ restore_light_data }}"
      transition: "{{ LIGHT_RESTORE_TRANSITION }}"
    enabled: !input restore_lights
  - alias: If PC has been turned on and should turn off
    if:
      - condition: template
        value_template: "{{ pc_managed and states[pc_wol] | attr('domain') == 'switch' }}"
    then:
      - alias: Turn off PC
        action: switch.turn_off
        target:
          entity_id: !input pc_wol
    enabled: !input turn_off_pc
  - alias: Extra action on session end
    sequence: !input extra_end
    continue_on_error: true
