blueprint:
  name: VR Manager 🥽
  source_url: "https://github.com/etiennec78/Home-Automation/blob/master/Blueprints/VR-Manager/vr-manager.yaml"
  domain: automation
  author: etiennec78
  description: |-
    # VR Manager 🥽

    ## Description 📝
    A blueprint that sets up the devices in your room to play VR

    <details>
      <summary><h2>Key Features 🌟</h2></summary>

    When a VR session starts:
    * Turn on computer
    * Turn on lights for room tracking

    </details>

    ## More Info ℹ️
    * Version: 2.1.0
    * GitHub: [click here](https://github.com/etiennec78/Home-Automation/tree/master/Blueprints/VR-Manager)
    * Discord: @etiennec78
    [![ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/C0C5XVRMM)
  homeassistant:
    min_version: 2025.4.0  # Outer scope variables: PR #141114
  input:
    headset:
      name: VR headset
      icon: mdi:virtual-reality
      input:
        hmd_trackers:
          name: 🛜 Headset device trackers
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: device_tracker
        hmd_device:
          name: 🥽 Headset device
          default: ""
          selector:
            device:
              filter:
                integration: mobile_app
        startup_app:
          name: 🚀 Startup app
          description: |-
            The **app** to launch on your VR device when the **automation starts**
            > The input above is required
          default: ""
          selector:
            select:
              custom_value: true
              options:
                - label: Don't start an app
                  value: ""
                - label: ALVR
                  value: alvr.client
                - label: Meta Air Link
                  value: com.oculus.xrstreamingclient
                - label: Meta Remote Desktop (2D)
                  value: com.oculus.remotedesktop
                - label: Steam Link
                  value: com.valvesoftware.steamlinkvr
                - label: WiVRn
                  value: org.meumeu.wivrn
    computer:
      name: Computer
      icon: mdi:desktop-tower-monitor
      input:
        pc_router_tracker:
          name: 🖥️ PC router device tracker
          default: ""
          selector:
            entity:
              filter:
                domain: device_tracker
        pc_wol:
          name: 💤 Wake On LAN entity
          default: []
          selector:
            entity:
              filter:
                integration: wake_on_lan
                domain:
                  - button
                  - switch
        turn_off_pc:
          name: 🛑 Turn off PC
          description: |-
            Turn off the PC at the end of the VR session
            Uses the WoL switch
          default: false
          selector:
            boolean:
    player:
      name: Player
      icon: mdi:account
      input:
        player:
          name: 👤 Player
          default: ""
          selector:
            entity:
              filter:
                domain: person
        confirm_presence:
          name: 📍 Confirm home presence
          description: |-
            Check that the player is home before starting the automation
          default: false
          selector:
            boolean:
        room_tracker:
          name: 🔎 Player room tracker
          description: |-
            Sensor to check that the player is in a vr room before starting the automation
          default: ""
          selector:
            entity:
              multiple: true
              filter:
                domain: bermuda__custom_device_class
        vr_rooms:
          name: 🏠 VR rooms
          default: []
          selector:
            area:
              multiple: true
        ble_scanner_switches:
          name: ⏯️ BLE scanner activator switches
          description: |-
            **[Switches](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md#bluetooth-scanner-switch-)** to automatically **start and stop BLE scanning** when needed
            > *Leave empty if you want your BLE scanners to be always on*
          default: []
          selector:
            entity:
              filter:
                domain: switch
    lights:
      name: Lights
      icon: mdi:lightbulb-group
      input:
        lights:
          name: 💡 Room lights
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: light
        restore_lights:
          name: 💡 Restore lights state
          description: |-
            Turn off the lights turned on by this blueprint at the end of the vr session
          default: true
          selector:
            boolean:
        light_brightness:
          name: ✨ Light brightness
          default: 20
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        light_sensor:
          name: 🛋️ Room light sensor
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
                device_class: illuminance
        light_sensor_value:
          name: 🛋️ Room light sensor value
          description: Turn on the lights below this light level
          default: 100
          selector:
            number:
              min: 0
              max: 200
              unit_of_measurement: lux
        sun:
          name: ☀️ Sun
          default: ""
          selector:
            entity:
              filter:
                domain: sun
        sun_elevation:
          name: 🌅 Sun elevation
          description: Turn on the lights below this sun elevation
          default: 6
          selector:
            number:
              min: -90
              max: 90
              unit_of_measurement: °
    notifications:
      name: Notification settings
      icon: mdi:bell
      input:
        send_notification:
          name: 💬 Send notifications
          default: false
          description: Send notifications to your headset when the automation is triggered and stopped
          selector:
            boolean:
        start_confirmation:
          name: 👆 Tap to start
          description: Only **start** the VR Manager if the user has **tapped** the notification button in his headset
          default: false
          selector:
            boolean:
        language:
          name: 🌍 Notification language
          description: |-
            The **language** used for **notifications**
            > *If your language is not supported by this blueprint, please [open a pull request](https://github.com/etiennec78/Home-Automation/pulls)*
          default: "en"
          selector:
            language:
              languages:
                - en
                - fr
        custom_translations:
          name: 🈂️ Custom translations
          description: |-
            A **YAML** dictionary to override the default **notification translations**
            > *You can find the translation keys in the `strings['en']` variable in the code, or in your traces*
          default:
            message: {}
            button: {}
          selector:
            object:
    extra_actions:
      name: Extra actions
      icon: mdi:plus-circle
      collapsed: true
      input:
        extra_start:
          name: ➕ On session start
          description: |-
            > Examples: Fan, Wi-Fi priority switch, door lock
          default: []
          selector:
            action:
        extra_end:
          name: ➕ On session end
          description: |-
            > Examples: All of the above, lights
          default: []
          selector:
            action:

triggers:
  - alias: VR headset turns on
    trigger: state
    entity_id: !input hmd_trackers
    to: home
    from:
      - not_home
      - unavailable
      - unknown

variables:
  MAX_INT: 2147483647
  hmd_device: !input hmd_device
  startup_app: !input startup_app
  pc_router_tracker: !input pc_router_tracker
  pc_wol: !input pc_wol
  player: !input player
  room_tracker: !input room_tracker
  vr_rooms: !input vr_rooms
  ble_scanner_switches: !input ble_scanner_switches
  sun: !input sun
  sun_elevation: !input sun_elevation
  light_sensor: !input light_sensor
  light_sensor_value: !input light_sensor_value
  light_brightness: !input light_brightness
  send_notification: !input send_notification
  start_confirmation: !input start_confirmation
  language: !input language
  custom_translations: !input custom_translations
  notify_service: >-
    {{
      none if hmd_device == ''
      else (
        device_attr(hmd_device, 'name')
        | slugify
        | regex_replace('^', 'notify.mobile_app_')
      )
    }}
  ios_device: >-
    {{
      false if notify_service is none
      else device_attr(hmd_device, 'manufacturer') == 'Apple'
    }}
  blueprint_name: "{{ state_attr(this.entity_id, 'friendly_name') }}"
  start_order_id: "{{ 'start_order_' ~ this.context.id }}"
  strings:
    en:
      message:
        request: "Start your VR setup ?"
        starting: Setting up your VR setup
        stopping: Restoring your VR setup
      start: "Start"
    fr:
      message:
        request: "Démarrer le setup VR ?"
        starting: Mise en place du setup VR
        stopping: Restoration du setup VR
      button:
        start: "Démarrer"

conditions:
  - alias: Confirm the user presence at home before starting
    condition: template
    value_template: "{{ is_state(player, 'home') }}"
    enabled: !input confirm_presence

actions:
  - alias: If the automation should check that the user is in the vr room
    if:
      - condition: template
        value_template: "{{ room_tracker != '' }}"
    then:
      - variables:
          ble_scanners_to_manage: >-
            {%
              if ble_scanner_switches == []
              or is_state(room_tracker, vr_rooms)
            %}
              {{ [] }}
            {% else %}
              {{
                ble_scanner_switches
                | select('is_state', 'off')
                | list
              }}
            {% endif %}
      - alias: Turn on BLE scanner to manage
        action: switch.turn_on
        target:
          entity_id: "{{ ble_scanners_to_manage }}"
        continue_on_error: true
      - alias: Confirm the user presence in the room before starting
        wait_template: "{{ is_state(room_tracker, vr_rooms) }}"
        timeout: 30
      - alias: Turn off managed BLE scanners
        action: switch.turn_off
        target:
          entity_id: "{{ ble_scanners_to_manage }}"
        continue_on_error: true
      - alias: If the player is not in his room
        if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - stop: Player not in room
  - variables:
      pc_managed: false
  - alias: Skip this sequence once if a confirmation from the user is needed
    repeat:
      count: "{{ 2 if start_confirmation else 1 }}"
      sequence:
        - variables:
            confirmed: "{{ not start_confirmation or repeat.index > 1 }}"
        - alias: Skip this sequence once if a confirmation from the user is needed
          if:
            - condition: template
              value_template: "{{ not confirmed }}"
          then:
            - alias: If the PC is off
              if:
                - condition: template
                  value_template: >-
                    {{
                      pc_router_tracker ~ pc_wol == ''
                      or pc_router_tracker != ''
                        and is_state(pc_router_tracker, 'not_home')
                      or pc_wol != ''
                        and is_state(pc_wol, 'off')
                    }}
              then:
                - alias: Turn on PC
                  action: >-
                    {% set domain = states[pc_wol].domain %}
                    {% set action = 'turn_on' if domain == 'switch' else 'press' %}
                    {{ domain ~ '.' ~ action }}
                  target:
                    entity_id: !input pc_wol
                - variables:
                    pc_managed: true
            - variables:
                lights_to_turn_off: []
              enabled: !input restore_lights
            - repeat:
                for_each: !input lights
                sequence:
                  - alias: Continue if this light is off
                    condition: template
                    value_template: "{{ is_state(repeat.item, 'off') }}"
                  - alias: Continue if the sun is too low to light up the room
                    condition: template
                    value_template: >-
                      {% set elevation = state_attr(sun, 'elevation') %}
                      {{ not is_number(elevation) or elevation < sun_elevation }}
                  - alias: Continue if the room light level is too low
                    condition: template
                    value_template: >-
                      {% set light = states(light_sensor) %}
                      {{ not is_number(light) or light < light_sensor_value }}
                  - alias: Continue if the light brightness is too low
                    condition: template
                    value_template: >-
                      {% set brightness = state_attr(repeat.item, 'brightness') %}
                      {{ not is_number(brightness) or brightness < light_brightness }}
                  - alias: Turn on light
                    action: light.turn_on
                    target:
                      entity_id: "{{ repeat.item }}"
                    data:
                      brightness_pct: !input light_brightness
                  - alias: Remember this light
                    variables:
                      lights_to_turn_off: "{{ lights_to_turn_off + [repeat.item] }}"
                    enabled: !input restore_lights
            - alias: Extra action on session start
              sequence: !input extra_start
              continue_on_error: true
            - alias: If an app needs to be opened
              if:
                - condition: template
                  value_template: "{{ startup_app != '' and notify_service is not none }}"
              then: &app_launch
                - alias: Open the app
                  action: "{{ notify_service }}"
                  data:
                    message: "command_launch_app"
                    data:
                      package_name: "{{ startup_app }}"
                      confirmation: "{{ not ios_device }}"
                  continue_on_error: true
        - alias: If a notification must be sent
          if:
            - condition: or
              conditions:
                - condition: template
                  value_template: !input send_notification
                - condition: template
                  value_template: "{{ not confirmed }}"
            - condition: template
              value_template: "{{ notify_service is not none }}"
          then: &start_notif
            - alias: Get the notification
              variables:
                title: "{{ blueprint_name }}"
                message_id: "{{ 'starting' if confirmed else 'request' }}"
                buttons: []
                message: &get_message >-
                  {# Custom translation #}
                  {%
                    if 'message' in custom_translations
                    and message_id in custom_translations['message']
                  %}
                    {{ custom_translations['message'][message_id] }}
                  {# Selected language #}
                  {% elif message_id in strings[language]['message'] %}
                    {{ strings[language]['message'][message_id] }}

                  {# Fallback to english #}
                  {% else %}
                    {{ strings['en']['message'][message_id] }}
                  {% endif %}
            - alias: If a button needs to be added to the notification
              if:
                - condition: template
                  value_template: "{{ not confirmed }}"
              then:
                - alias: Get the button translation
                  variables:
                    button_id: "start"
                    button: >-
                      {# Custom translation #}
                      {%
                        if 'button' in custom_translations
                        and button_id in custom_translations['button']
                      %}
                        {{ custom_translations['button'][button_id] }}

                      {# Selected language #}
                      {% elif button_id in strings[language]['button'] %}
                        {{ strings[language]['button'][button_id] }}

                      {# Fallback to english #}
                      {% else %}
                        {{ strings['en']['button'][button_id] }}
                      {% endif %}
                    buttons:
                      - action: "{{ start_order_id }}"
                        title: "{{ button }}"
                        icon: sfsymbols:play
            - alias: Notify that the VR setup is being set up or ask for a confirmation
              action: "{{ notify_service }}"
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                data:
                  notification_icon: mdi:virtual-reality
                  channel: VR Manager
                  tag: vr-manager-start
                  confirmation: "{{ not ios_device }}"
                  actions: "{{ buttons }}"
              continue_on_error: true
        - variables:
            wait_start_ack: >-
              {{
                send_notification
                and not ios_device
                and notify_service is not none
              }}
            wait_app_ack: >-
              {{
                startup_app != ''
                and not ios_device
                and notify_service is not none
                and confirmed
              }}
            notif_rounds: 0
        - alias: Repeat until the user has stopped his headset
          repeat:
            until: "{{ wait.trigger.id == 'hmd_off' }}"
            sequence:
              - wait_for_trigger:
                  - alias: Wait for VR headset to turn off
                    trigger: state
                    id: hmd_off
                    entity_id: !input hmd_trackers
                    to:
                      - not_home
                      - unknown
                    from: home
                  - alias: Start notification received
                    trigger: event
                    id: start_ack
                    event_type: mobile_app_notification_received
                    event_data:
                      tag: vr-manager-start
                    enabled: "{{ wait_start_ack }}"
                  - alias: App launch command received
                    trigger: event
                    id: app_ack
                    event_type: mobile_app_notification_received
                    event_data:
                      tag: vr-manager-app-launch
                    enabled: "{{ wait_app_ack }}"
                  - alias: Start button pressed
                    trigger: event
                    id: start_order
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ start_order_id }}"
                    enabled: "{{ not confirmed }}"
                timeout: >-
                  {% if wait_start_ack or wait_app_ack %}
                    3
                  {% else %}
                    {{ MAX_INT }}
                  {% endif %}
              - alias: If an event occured
                if:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                then:
                  - choose:
                      - alias: The start notification has been received
                        conditions:
                          - condition: template
                            value_template: "{{ wait.trigger.id == 'start_ack' }}"
                        sequence:
                          - variables:
                              wait_start_ack: false
                      - alias: The app launch command has been received
                        conditions:
                          - condition: template
                            value_template: "{{ wait.trigger.id == 'app_ack' }}"
                        sequence:
                          - variables:
                              wait_app_ack: false
                else:
                  - alias: If the start notification has not been received yet
                    if:
                      - condition: template
                        value_template: "{{ wait_start_ack }}"
                    then: *start_notif
                  - alias: If the app launch command has not been received yet
                    if:
                      - condition: template
                        value_template: "{{ wait_app_ack }}"
                    then: *app_launch
                  - variables:
                      notif_rounds: "{{ notif_rounds + 1 }}"
                  - alias: Stop sending notifications after 5 tries
                    if:
                      - condition: template
                        value_template: "{{ notif_rounds > 4 }}"
                    then:
                      - variables:
                          wait_start_ack: false
                          wait_app_ack: false
        - alias: If a notification must be sent
          if:
            - condition: template
              value_template: !input send_notification
            - condition: template
              value_template: "{{ notify_service is not none }}"
            - condition: template
              value_template: "{{ confirmed }}"
          then:
            - alias: Get the notification
              variables:
                title: "{{ blueprint_name }}"
                message_id: "stopping"
                message: *get_message
            - alias: Notify that the VR setup is being restored
              action: "{{ notify_service }}"
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                data:
                  notification_icon: mdi:virtual-reality
                  channel: VR Manager
                  tag: vr-manager-end
              continue_on_error: true
  - alias: Don't restore anything if the button was never pressed
    condition: template
    value_template: "{{ confirmed }}"
  - alias: Restore lights
    repeat:
      for_each: "{{ lights_to_turn_off }}"
      sequence:
        - action: light.turn_off
          target:
            entity_id: "{{ repeat.item }}"
    enabled: !input restore_lights
  - alias: If PC has been turned on and should turn off
    if:
      - condition: template
        value_template: "{{ pc_managed and states[pc_wol].domain == 'switch' }}"
    then:
      - alias: Turn off PC
        action: switch.turn_off
        target:
          entity_id: !input pc_wol
    enabled: !input turn_off_pc
  - alias: Extra action on session end
    sequence: !input extra_end
    continue_on_error: true
