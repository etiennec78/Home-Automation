blueprint:
  name: VR Manager 🥽
  source_url: "https://github.com/etiennec78/Home-Automation/blob/master/Blueprints/VR-Manager/vr-manager.yaml"
  domain: automation
  author: etiennec78
  description: |-
    # VR Manager 🥽

    ## Description 📝
    A blueprint that sets up the devices in your room to play VR

    <details>
      <summary><h2>Key Features 🌟</h2></summary>

    When a VR session starts:
    * Turn on computer
    * Turn on lights for room tracking

    </details>

    ## More Info ℹ️
    * Version: 2.1.0
    * GitHub: [click here](https://github.com/etiennec78/Home-Automation/tree/master/Blueprints/VR-Manager)
    * Discord: @etiennec78
    [![ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/C0C5XVRMM)
  homeassistant:
    min_version: 2025.4.0  # Outer scope variables: PR #141114
  input:
    headset:
      name: VR headset
      icon: mdi:virtual-reality
      input:
        hmd_trackers:
          name: 🛜 Headset device trackers
          selector:
            entity:
              multiple: true
              filter:
                domain: device_tracker
    computer:
      name: Computer
      icon: mdi:desktop-tower-monitor
      input:
        pc_router_tracker:
          name: 🖥️ PC router device tracker
          default: ""
          selector:
            entity:
              filter:
                domain: device_tracker
        pc_wol:
          name: 💤 Wake On LAN entity
          default: []
          selector:
            entity:
              filter:
                integration: wake_on_lan
                domain: button
    lights:
      name: Lights
      icon: mdi:lightbulb-group
      input:
        lights:
          name: 💡 Room lights
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: light

triggers:
  - alias: VR headset turns on
    trigger: state
    entity_id: !input hmd_trackers
    to: home
    from:
      - not_home
      - unavailable
      - unknown

variables:
  pc_router_tracker: !input pc_router_tracker

actions:
  - alias: If the PC is off
    if:
      - condition: template
        value_template: >-
          {{
            pc_router_tracker == ''
            or is_state(pc_router_tracker, 'off')
          }}
    then:
      - alias: Turn on PC
        action: button.press
        target:
          entity_id: !input pc_wol
  - alias: Turn on lights
    action: light.turn_on
    target:
      entity_id: !input lights
