blueprint:
  name: Charging Notification 🔋
  source_url: "https://github.com/etiennec78/Home-Automation/blob/master/Blueprints/Charging-Notification/charging-notification.yaml"
  domain: automation
  author: etiennec78
  description: |-
    # Charging Notification 🔋

    ## Description 📝
    Automation to track the progress of device charging

    <details>
      <summary><h2>Key Features 🌟</h2></summary>
      * Easy configuration, only one device needed 🛠️

    </details>

    ## More info ℹ️
    * Version: 2.0.0
    * Set up sensors: [click here](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md)
    * Github: [click here](https://github.com/etiennec78/Home-Automation/tree/master/Blueprints/Charging-Notification)
    * Discord: @etiennec78
    [![ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/etiennec78)
  homeassistant:
    min_version: 2024.6.0
  input:
    charging_device:
      name: 🔋 Charging device
      description: |-
        The **device** whose **charging** should be monitored
      selector:
        device:
    notify_devices:
      name: 💬 Notify devices
      description: |-
        Each [**device** to **notify**](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md#notify-services-)
        > Optional
      default: []
      selector:
        device:
          multiple: true
          filter:
            integration: mobile_app
    notification_settings:
      name: Notification settings
      icon: mdi:bell
      collapsed: true
      input:
        language:
          name: 🌍 Notification language
          description: |-
            The **language** used for **notifications**
            > *If your language is not supported by this blueprint, please [open a pull request](https://github.com/etiennec78/Home-Automation/pulls)*
          default: "en"
          selector:
            language:
              languages:
                - en
                - fr
        custom_translations:
          name: 🈂️ Custom translations
          description: |-
            A **YAML** dictionary to override the default **notification translations**
            > *You can find the translation keys in the `strings['en']` variable in the code, or in your traces*
          default:
            title: {}
            message: {}
          selector:
            object:
        persistent_notification:
          name: 🔔 Persistent notifications
          description: Show notifications in Home Assistant **[dashboard](https://www.home-assistant.io/integrations/persistent_notification)**
          default: false
          selector:
            boolean:
    config_checker:
      name: Config checker
      icon: mdi:shield-check
      collapsed: true
      input:
        run_checks_when_enabled:
          name: 🧪 Run tests when blueprint enabled
          description: Run tests after adding the blueprint, updating inputs, and after HA startup
          default: true
          selector:
            boolean:

triggers:
  - alias: Trigger when the the user updated inputs or enabled the blueprint
    trigger: template
    id: blueprint_enabled
    value_template: "{{ is_state(this.entity_id, 'on') }}"
  - alias: Trigger when HA starts
    trigger: homeassistant
    id: ha_started
    event: start

variables:
  notify_devices: !input notify_devices
  language: !input language
  custom_translations: !input custom_translations
  notify_services: >-
    {{
      notify_devices
      | map('device_attr', 'name')
      | map('slugify')
      | map('regex_replace', '^', 'notify.mobile_app_')
      | list
    }}
  charging_device: !input charging_device
  plug_entity: >-
    {{
      charging_device
      | device_entities
      | select('is_state_attr', 'device_class', 'plug')
      | list
      | first
    }}
  battery_entity: >-
    {{
      charging_device
      | device_entities
      | select('is_state_attr', 'device_class', 'battery')
      | list
      | first
    }}
  remaining_sensor: >-
    {{
      charging_device
      | device_entities
      | select('is_state_attr', 'device_class', 'duration')
      | list
      | first
    }}
  error_checker_ran: false
  active: true
  notification_tag: "charging-{{ this.attributes.id }}"
  config_checker_tag: "config-checker-{{ this.attributes.id }}"
  device_name: "{{ device_attr(charging_device, 'name') }}"
  blueprint_name: "{{ state_attr(this.entity_id, 'friendly_name') }}"
  strings:
    en:
      title:
        charging: "{{ device_name }} ⚡"
        charging_stopped: "{{ device_name }} 🚫"
        valid_config: "{{blueprint_name}}: Valid configuration 🛠️✅"
        invalid_config: "{{blueprint_name}}: Invalid configuration 🛠️❌"
      message:
        charging_started: Charging started
        charging_ongoing: "Battery charge: {value}"
        charging_stopped: Charging stopped at {value}
        something_went_wrong: "Something went wrong ! The blueprint stopped unexpectedly."
        valid_config: "Your configuration seems valid"
        more_info: "More info"
        invalid_translations: "Your custom translations are not valid. Check the following keys: '{data}'. (#1)"
    fr:
      title:
        charging: "{{ device_name }} ⚡"
        charging_stopped: "{{ device_name }} 🚫"
        valid_config: "{{blueprint_name}}: Configuration valide 🛠️✅"
        invalid_config: "{{blueprint_name}}: Configuration invalide 🛠️❌"
      message:
        charging_started: Le chargement a démarré
        charging_ongoing: "Chargement en cours: {value}"
        charging_stopped: Le chargement a été arrêté à {value}
        something_went_wrong: "Un problème est survenu ! Le blueprint s'est arrêté de manière inattendue."
        valid_config: "Votre configuration semble valide"
        more_info: "Plus d'infos"
        invalid_translations: "Vos traductions personnalisées ne sont pas valides. Vérifiez les valeurs suivantes: '{data}'. (#1)"

actions:
  - alias: Check that custom strings are valid
    variables:
      custom_translations_error: "{{ custom_translations is not mapping }}"
  - alias: If the custom translations is not a mapping
    if:
      - condition: template
        value_template: "{{ custom_translations_error }}"
    then:
      - alias: Reset the custom translations
        variables:
          custom_translations: {}
  - alias: If the config checker should run checks
    if:
      - condition: or
        conditions:
          - alias: If the blueprint was executed manually
            condition: template
            value_template: "{{ trigger.platform is none }}"
          - alias: If the user wants errors to be checked when the blueprint is enabled
            condition: template
            value_template: !input run_checks_when_enabled
    then:
      ##################
      # ERROR CHECKING #
      ##################

      - alias: Initialize variables for the error checker
        variables:
          error_checker_ran: true
          successfull_check: false
          messages: []
          error_level: 0
      - alias: Run the error checker in an error-safe sequence
        sequence:
          - alias: Check for errors
            repeat:
              for_each:
                - alias: Check custom translations
                  error: >-
                    {% set data = namespace(invalid=[]) %}
                    {% for key, sub_items in custom_translations.items() %}
                      {% if key not in strings['en'] %}
                        {% set data.invalid = data.invalid + [key] %}
                      {% else %}
                        {% for subkey, value in sub_items.items() %}
                          {%
                            if value is not string
                            or subkey not in strings['en'][key]
                          %}
                            {% set data.invalid = data.invalid + [subkey] %}
                          {% endif %}
                        {% endfor %}
                      {% endif %}
                    {% endfor %}
                    {{ data.invalid }}
                  message_id: "invalid_translations"
                  level: 1
              sequence:
                - alias: If a check failed
                  if:
                    - condition: template
                      value_template: >-
                        {% set error = repeat.item.error %}
                        {{ error != [] if error is list else error }}
                  then:
                    - alias: If the error level is higher than the current highest
                      if:
                        - condition: template
                          value_template: "{{ repeat.item.level > error_level }}"
                      then:
                        - alias: Save the new highest error level
                          variables:
                            error_level: "{{ repeat.item.level }}"
                    - alias: Append the error message to the list
                      variables:
                        message_id: "{{ repeat.item.message_id }}"
                        message: &get_message >-
                          {# Custom translation #}
                          {%
                            if 'message' in custom_translations
                            and message_id in custom_translations['message']
                          %}
                            {{ custom_translations['message'][message_id] }}

                          {# Selected language #}
                          {% elif message_id in strings[language]['message'] %}
                            {{ strings[language]['message'][message_id] }}

                          {# Fallback to english #}
                          {% else %}
                            {{ strings['en']['message'][message_id] }}
                          {% endif %}
                    - alias: If the error variable contains a list
                      if:
                        - condition: template
                          value_template: "{{ repeat.item.error is list }}"
                      then:
                        - alias: Format the string with error data
                          variables:
                            message: >-
                              {{
                                message.format(
                                  data=(
                                    ', '.join(repeat.item.error)
                                  )
                                )
                              }}
                    - alias: Append the error message to the list
                      variables:
                        messages: "{{ messages | union([message]) }}"
          - alias: If the config is valid
            if:
              - condition: template
                value_template: "{{ messages | length == 0 }}"
            then:
              - alias: If the blueprint was triggered manually
                if:
                  - condition: template
                    value_template: "{{ trigger.platform is none }}"
                then:
                  - alias: Set message ids
                    variables:
                      title_id: "valid_config"
                      message_id: "valid_config"
                  - alias: Get notification translation
                    variables: &get_translation
                      message: *get_message
                      title: &get_title >-
                        {# Custom translation #}
                        {%
                          if 'title' in custom_translations
                          and title_id in custom_translations['title']
                        %}
                          {{ custom_translations['title'][title_id] }}

                        {# Selected language #}
                        {% elif title_id in strings[language]['title'] %}
                          {{ strings[language]['title'][title_id] }}

                        {# Fallback to english #}
                        {% else %}
                          {{ strings['en']['title'][title_id] }}
                        {% endif %}
                  - alias: Notify all users on the dashboard that the config is valid
                    action: persistent_notification.create
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
                      notification_id: "{{ config_checker_tag }}"
                    continue_on_error: true
                else:
                  - alias: Remove the previous dashboard notification
                    action: persistent_notification.dismiss
                    data:
                      notification_id: "{{ config_checker_tag }}"
                    continue_on_error: true
            else:
              - alias: Build the notification
                variables:
                  title_id: "invalid_config"
                  title: *get_title
                  message: "{{ '• ' ~ '\n• '.join(messages) }}"
              - alias: Build the more info link
                variables:
                  message_id: "more_info"
                  more_info: *get_message
                  link: "https://github.com/etiennec78/Home-Automation/tree/master/Blueprints/README.md#error-codes-table-%EF%B8%8F"
                  more_info_md: "[{{more_info}}]({{link}})"
              - alias: Notify all users on the dashboard that the config is invalid
                action: persistent_notification.create
                data:
                  title: "{{ title }}"
                  message: "{{ message ~ '\n\n' ~ more_info_md }}"
                  notification_id: "{{ config_checker_tag }}"
                continue_on_error: true
          - alias: Confirm that no error occured while the config checker was running
            variables:
              successful_check: true
        continue_on_error: true
      - alias: If an error occured while the config checker was running
        if:
          - condition: template
            value_template: "{{ not successful_check }}"
        then:
          - alias: Set notification ids
            variables:
              title_id: "invalid_config"
              message_id: "something_went_wrong"
          - alias: Get notification translation
            variables: *get_translation
          - alias: Notify all users on the dashboard that an error occured
            action: persistent_notification.create
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              notification_id: "{{ config_checker_tag }}"
            continue_on_error: true
          - stop: Config checker failed
            error: true

  - alias: Only continue if the error checker did not run, or no critical error was raised
    condition: template
    value_template: "{{ not error_checker_ran or error_level < 2 }}"

  - alias: Repeat undefinetly
    repeat:
      while: "{{ true }}"
      sequence:
        - alias: Get whether the device was plugged
          variables:
            plugged: "{{ is_state(plug_entity, 'on') }}"
        - alias: Don't wait if this is the first loop and the device is already charging
          if: "{{ not(repeat.first and plugged) }}"
          then:
            - alias: Wait for the device to start or stop charging
              wait_for_trigger:
                - alias: Device starts charging
                  trigger: template
                  id: charging_started
                  value_template: "{{ is_state(plug_entity, 'on') }}"
                  enabled: "{{ not plugged }}"
                - alias: Charge got updated
                  trigger: event
                  id: charge_updated
                  event_type: state_changed
                  event_data:
                    entity_id: "{{ battery_entity }}"
                  enabled: "{{ plugged and active }}"
                - alias: Remaining time got updated
                  trigger: event
                  id: eta_updated
                  event_type: state_changed
                  event_data:
                    entity_id: "{{ remaining_sensor }}"
                  enabled: "{{ plugged and active }}"
                - alias: Device stops charging
                  trigger: template
                  id: charging_stopped
                  value_template: "{{ not is_state(plug_entity, 'on') }}"
                  enabled: "{{ plugged }}"
                - alias: Mobile notification cleared
                  trigger: event
                  id: notification_cleared
                  event_type: mobile_app_notification_cleared
                  event_data:
                    tag: "{{ notification_tag }}"
                  enabled: "{{ active }}"
                - alias: Persistent notification cleared
                  trigger: persistent_notification
                  id: persistent_cleared
                  notification_id: "{{ notification_tag and active }}"
                  update_type: removed
          else:
            - alias: Trigger the device charging notification
              variables:
                wait:
                  trigger:
                    id: "charging_started"
        - choose:
            - alias: If the mobile notification was cleared
              conditions: "{{ wait.trigger.id == 'notification_cleared' }}"
              sequence:
                - alias: Remove the dashboard notification
                  action: persistent_notification.dismiss
                  data:
                    notification_id: "{{ notification_tag }}"
                  continue_on_error: true
                  enabled: !input persistent_notification
                - alias: Stop listening to updates
                  variables:
                    active: false
            - alias: If the dashboard notification was cleared
              conditions: "{{ wait.trigger.id == 'persistent_cleared' }}"
              sequence:
                - alias: Remove the notification on all devices
                  repeat:
                    for_each: "{{ notify_services }}"
                    sequence:
                      - action: "{{ repeat.item }}"
                        data:
                          message: clear_notification
                          data:
                            tag: "{{ notification_tag }}"
                        continue_on_error: true
                - alias: Stop listening to updates
                  variables:
                    active: false
          default:
            - alias: Get whether the device was plugged and if notifications were not dismissed
              variables:
                plugged: "{{ is_state(plug_entity, 'on') }}"
                not_dismissed: "{{ active }}"
            - alias: If the charging stopped
              if: "{{ wait.trigger.id == 'charging_stopped' }}"
              then:
                - alias: Start listening for updates
                  variables:
                    active: true
            - alias: Only continue if the notifications were not dismissed
              condition: template
              value_template: "{{ not_dismissed }}"
            - alias: Get the current charging value
              variables:
                state: "{{ states(battery_entity) }}"
                unit: "{{ state_attr(battery_entity, 'unit_of_measurement') or '%' }}"
                value: "{{ state ~ unit }}"
                remaining: >-
                  {% if remaining_sensor | has_value %}
                    {% set value = states(remaining_sensor) | float %}
                    {% if is_state_attr(remaining_sensor, 'unit_of_measurement', 'min') %}
                      {% set value = value * 60 %}
                    {% elif is_state_attr(remaining_sensor, 'unit_of_measurement', 'h') %}
                      {% set value = value * 3600 %}
                    {% endif %}
                    {{ value }}
                  {% else %}
                    {{ 0 }}
                  {% endif %}
            - alias: Set the message ids
              variables:
                title_id: "{{ 'charging' if plugged else 'charging_stopped' }}"
                message_id: >-
                  {% if plugged %}
                    {% if battery_entity | has_value %}
                      charging_ongoing
                    {% else %}
                      charging_started
                    {% endif %}
                  {% else %}
                    charging_stopped
                  {% endif %}
            - alias: Get the notification translation
              variables: *get_translation
            - alias: Format the notification
              variables:
                message: "{{ message.format(value=value) }}"
            - alias: For each notify service
              repeat:
                for_each: "{{ notify_services }}"
                sequence:
                  - alias: Send a charging notification
                    action: "{{ repeat.item }}"
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
                      data:
                        notification_icon: >-
                          mdi:battery-
                          {{-
                            'charging' ~ (
                              '-' ~ state | round(-1) | int
                              if battery_entity | has_value
                              else ''
                            )
                            if wait.trigger.id == 'charging_started'
                            else 'off'
                          -}}
                        sticky: true
                        progress_indeterminate: '{{ not battery_entity | has_value }}'
                        progress: "{{ state if battery_entity | has_value else 0 }}"
                        progress_max: 100
                        chronometer: "{{ remaining > 0 }}"
                        when: "{{ remaining }}"
                        when_relative: true
                        tag: "{{ notification_tag }}"
                        channel: Charging notification
                    continue_on_error: true
            - alias: Send a persistent notification
              action: persistent_notification.create
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                notification_id: "{{ notification_tag }}"
              continue_on_error: true
              enabled: !input persistent_notification
mode: restart
