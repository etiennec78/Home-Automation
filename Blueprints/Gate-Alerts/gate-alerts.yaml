blueprint:
  name: Gate Alerts 🚨
  source_url: "https://github.com/etiennec78/Home-Automation/blob/master/Blueprints/Gate-Alerts/gate-alerts.yaml"
  domain: automation
  author: etiennec78
  description: |-
    # Gate Alerts 🚨

    ## Description 📝
    A blueprint that notifies selected users when the gate:
    * Opens 🔓
    * Closes 🔐
    * Encounters an error ⚠
    * Has been left open for too long 🔓
    * Has been offline for too long 🌐

    ## Key Features 🌟
    * Compatible with gate switches, covers, and position tracked covers 🔗
    * Companion app notifications 🔔
    * Button to close the gate from notifications 🔐
    * Dashboard persistent notifications 📢
    * Android TTS support 📳
    * Media players TTS support 🔊
    * Built-in translations 🌍
    * Customizable extra actions ➕

    ## More Info ℹ️
    * Version: 2.0.0
    * Set up sensors: [click here](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md)
    * GitHub: [click here](https://github.com/etiennec78/Home-Automation/tree/master/Blueprints/Gate-Alerts)
    * Discord: @etiennec78
    [![ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/C0C5XVRMM)
  homeassistant:
    min_version: 2024.10.0
  input:
    common_settings:
      name: Essential inputs
      icon: "mdi:cog"
      input:
        gate:
          name: ⛩️ Gate
          description: Your gate entity
          selector:
            entity:
              filter:
                domain:
                  - switch
                  - cover
                  - input_boolean
                  - binary_sensor
        notification_type:
          name: 🔔 Notification type
          description: Type of **event** that should trigger notifications
          selector:
            select:
              options:
                - label: Opening
                  value: "open"
                - label: Closing
                  value: "close"
                - label: Error
                  value: "error"
                - label: Offline
                  value: "offline"
        notification_delay:
          name: ⌛ Notification delay
          description: Wait **time** in minutes before sending notifications
          default: 0
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: minutes
        error_message_sensor:
          name: ⚠️ Error Message Sensor
          description: |-
            Sensor that provides gate error messages
            *Note: Only needed for error notification type*
          default: []
          selector:
            entity:
              domain: sensor
        notify_devices:
          name: 💬 Notify devices
          description: |-
            Mobile **[devices](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md#notify-services-)** to **notify**
            *Note: Optional*
          default: []
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app

    notification_settings:
      name: Notification settings
      icon: mdi:bell
      collapsed: true
      input:
        language:
          name: Notification language
          description: The **language** in which **notifications** will be sent to you
          default: "en"
          selector:
            language:
              languages:
                - en
                - fr
        custom_translations:
          name: Custom translations
          description: |-
            A **json** dictionary to change the default **notifications translations**
            *Note : You can find the translation keys in the strings['en'] variable in the code or in your traces*
          default: |-
            {
              "title": {},
              "message": {}
            }
          selector:
            text:
              multiline: true
        car_visible:
          name: 🚗 Visible in Android Auto/CarPlay
          description: Show notifications on your **car's dashboard**
          default: true
          selector:
            boolean:
        persistent_notification:
          name: 🔔 Persistent notification
          description: Show notifications in Home Assistant **[dashboard](https://www.home-assistant.io/integrations/persistent_notification)**
          default: false
          selector:
            boolean:
        phone_tts:
          name: 📳 Phone TTS
          description: Read notifications **aloud** on selected **Android** phones
          default: false
          selector:
            boolean:
        phone_tts_stream:
          name: 📻 Phone TTS audio stream
          description: The **audio stream** used for playing the phone TTS. Can be useful to **bypass Do Not Disturb**.
          default: "notification_stream"
          selector:
            select:
              options:
                - label: Notification stream
                  value: "notification_stream"
                - label: Alarm stream
                  value: "alarm_stream"
                - label: Alarm stream (max volume)
                  value: "alarm_stream_max"

    speakers:
      name: Speakers
      icon: mdi:speaker-multiple
      collapsed: true
      input:
        speaker_tts_devices:
          name: 🔊 TTS speakers
          description: |-
            **Speakers** for **text-to-speech** announcements
            *Note: Optional*
          default: []
          selector:
            entity:
              multiple: true
              domain: media_player
        speaker_tts_service:
          name: 🎙️ TTS service
          description: |-
            **TTS service** you want to use for your speakers
            *Note: Optional*
          default: []
          selector:
            target:
              entity:
                domain: tts

    extra_actions:
      name: Extra actions
      icon: mdi:plus-circle
      collapsed: true
      input:
        extra_actions:
          name: ➕ Extra Actions
          description: |-
            Additional **actions** to execute when **triggered**
            *Note: Optional*
          default: []
          selector:
            action:

variables:
  gate: !input gate
  notification_type: !input notification_type
  notification_delay: !input notification_delay
  notify_devices: !input notify_devices
  notify_services: "{{ notify_devices | map('device_attr', 'name') | map('slugify') | map('regex_replace', '^', 'notify.mobile_app_') | list }}"
  speaker_tts_devices: !input speaker_tts_devices
  speaker_tts_service: !input speaker_tts_service
  error_message_sensor: !input error_message_sensor
  error: |-
    {% if error_message_sensor == [] %}
      none
    {% else %}
      {{ states(error_message_sensor) }}
    {% endif %}
  car_visible: !input car_visible
  language: !input language
  custom_translations: !input custom_translations
  default_custom_translations:
    title: {}
    message: {}
    button: {}
  custom_translations_json: "{{ custom_translations | from_json(none) }}"
  notification_tag: "gate-{{ notification_type }}"
  config_checker_tag: "{{ 'config-checker-' ~ this.context.id }}"
  closing_order_id: "{{ 'closing_order_' ~ this.context.id }}"
  blueprint_name: "{{ state_attr(this.entity_id, 'friendly_name') }}"
  strings:
    en:
      title:
        open: Gate opening 🔓
        still_open: Gate open 🔓
        left_open: Gate left open 🔓
        close: Gate closing 🔐
        error: Gate error ⚠
        offline: Gate offline 🌐
        valid_config: "{{blueprint_name}}: Valid configuration ✅"
        invalid_config: "{{blueprint_name}}: Invalid configuration 🛠️"
      message:
        open: The gate is opening
        still_open: The gate is open
        left_open: The gate has been left open for {{notification_delay}} minutes
        close: The gate is closing
        error: "The gate has encountered an error: {error}"
        offline: The gate has been offline for {{notification_delay}} minutes
        valid_config: "Your configuration seems valid"
        invalid_translations: "Your custom translations are not valid !"
        missing_error_sensor: "You have not entered the sensor containing gate error codes"
      button:
        close: Close 🔐
    fr:
      title:
        open: Ouverture portail 🔓
        still_open: Portail ouvert 🔓
        left_open: Portail laissé ouvert 🔓️
        close: Fermeture portail 🔐
        error: Erreur portail ⚠
        offline: Portail hors ligne 🌐
        valid_config: "{{blueprint_name}}: Configuration valide ✅"
        invalid_config: "{{blueprint_name}}: Configuration invalide 🛠️"
      message:
        open: Ouverture du portail en cours
        still_open: Le portail est ouvert
        left_open: Le portail est ouvert depuis {{notification_delay}} minutes
        close: Fermeture du portail en cours
        error: "Le portail a rencontré une erreur: {error}"
        offline: Le portail est hors ligne depuis {{notification_delay}} minutes
        valid_config: "Votre configuration semble valide"
        invalid_translations: "Vos traductions personnalisées ne sont pas valides !"
        missing_error_sensor: "Vous n'avez pas entré le capteur contenant les codes d'erreur du portail"
      button:
        close: Refermer 🔐

trigger_variables:
  notification_type: !input notification_type
  gate: !input gate

triggers:
  - alias: Wait for gate opening or fully open
    trigger: state
    entity_id: !input gate
    to:
      - "on"
      - "open"
      - "opening"
    not_from:
      - "unknown"
      - "unavailable"
    for:
      minutes: !input notification_delay
    enabled: "{{ notification_type == 'open' }}"

  - alias: Wait for gate closing
    trigger: state
    entity_id: !input gate
    to:
      - "off"
      - "closing"
      - "closed"
    not_from:
      - "unknown"
      - "unavailable"
    for:
      minutes: !input notification_delay
    enabled: "{{ notification_type == 'close' }}"

  - alias: Wait for error
    trigger: state
    entity_id: !input error_message_sensor
    not_to:
      - "unknown"
      - "unavailable"
      - ""
    enabled: "{{ notification_type == 'error' }}"

  - alias: Wait for gate unavailable for duration
    trigger: state
    entity_id: !input gate
    to: "unavailable"
    for:
      minutes: !input notification_delay
    enabled: "{{ notification_type == 'offline' }}"

conditions:
  - alias: If triggered by gate fully closed, only continue if it does not support position tracking
    condition: template
    value_template: "{{ notification_type != 'close' or not is_state(gate, 'closed') or state_attr(gate, 'supported_features') | bitwise_and(4) == 0 }}"

actions:
  - alias: Initialize variables for the error checker
    variables:
      messages: []
      custom_translations_error: "{{ custom_translations_json is none }}"
  - alias: If custom translations failed to be parsed as json
    if:
      - condition: template
        value_template: "{{ custom_translations_error }}"
    then:
      - alias: Reset custom translations
        variables:
          custom_translations_json: "{{ default_custom_translations }}"
  - alias: Check for errors
    repeat:
      for_each:
        - alias: Check custom translations
          condition: "{{ custom_translations_error }}"
          message_id: "invalid_translations"
        - alias: Check gate error sensor presence
          condition: "{{ notification_type == 'error' and not error_message_sensor }}"
          message_id: "missing_error_sensor"
        - alias: Check missing wifi sensors
          condition: |-
            {{
              'wifi' in only_open_near
              and wifi_devices | length == 0
            }}
          message_id: "missing_wifi_trackers"
      sequence:
        - alias: If a check failed
          if:
            - condition: template
              value_template: "{{ repeat.item.condition }}"
          then:
            - alias: Append the error message to the list
              variables:
                message_id: "{{ repeat.item.message_id }}"
                message: &get_message |-
                  {# Custom translation #}
                  {%
                    if 'message' in custom_translations_json
                    and message_id in custom_translations_json['message']
                  %}
                    {%
                      set message_string = (
                        custom_translations_json['message'][message_id]
                      )
                    %}

                  {# Selected language #}
                  {% elif message_id in strings[language]['message'] %}
                    {%
                      set message_string = (
                        strings[language]['message'][message_id]
                      )
                    %}

                  {# Fallback to english #}
                  {% else %}
                    {%
                      set message_string = (
                        strings['en']['message'][message_id]
                      )
                    %}
                  {% endif %}
                  {{
                    message_string.format(
                      notification_delay=notification_delay,
                      error=error
                    )
                  }}
                messages: "{{ messages | union([message]) }}"
  - alias: If the config is valid
    if:
      - condition: template
        value_template: "{{ messages | length == 0 }}"
    then:
      - alias: If the blueprint was triggered manually
        if:
          - condition: template
            value_template: "{{ trigger.platform is none }}"
        then:
          - alias: Set message ids
            variables:
              title_id: "valid_config"
              message_id: "valid_config"
          - alias: Get notification translation
            variables: &get_translation
              message: *get_message
              title: &get_title |-
                {# Custom translation #}
                {%
                  if 'title' in custom_translations_json
                  and title_id in custom_translations_json['title']
                %}
                  {{ custom_translations_json['title'][title_id] }}

                {# Selected language #}
                {% elif title_id in strings[language]['title'] %}
                  {{ strings[language]['title'][title_id] }}

                {# Fallback to english #}
                {% else %}
                  {{ strings['en']['title'][title_id] }}
                {% endif %}
          - alias: Notify all users on the dashboard that the config is valid
            action: persistent_notification.create
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              notification_id: "{{ config_checker_tag }}"
        else:
          - alias: Remove the previous dashboard notification
            action: persistent_notification.dismiss
            data:
              notification_id: "{{ config_checker_tag }}"
    else:
      - alias: Build the notification
        variables:
          title_id: "invalid_config"
          title: *get_title
          message: "{{ '\n'.join(messages) }}"
      - alias: Notify all users on the dashboard that the config is invalid
        action: persistent_notification.create
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          notification_id: "{{ config_checker_tag }}"

  - alias: Only continue if the blueprint was not triggered manually
    condition: template
    value_template: "{{ trigger.platform is not none }}"

  - alias: If gate paused or fully open, and supporting position
    if:
      condition: template
      value_template: "{{ notification_type == 'open' and is_state(gate, 'open') and notification_delay == 0 and state_attr(gate, 'supported_features') | bitwise_and(4) == 4 }}"
    then:
      - alias: Set notification ids
        variables:
          title_id: "still_open"
          message_id: "still_open"
          button_id: "close"
      - alias: Get notification translation
        variables: *get_translation
      - alias: Get button translation
        variables: &get_translation_button
          button_text: |-
            {# Custom translation #}
            {%
              if 'button' in custom_translations_json
              and button_id in custom_translations_json['button']
            %}
              {{ custom_translations_json['button'][button_id] }}

            {# Selected language #}
            {% elif button_id in strings[language]['button'] %}
              {{ strings[language]['button'][button_id] }}

            {# Fallback to english #}
            {% else %}
              {{ strings['en']['button'][button_id] }}
            {% endif %}
      - alias: Replace opening notif on each phone silently
        repeat:
          for_each: "{{ notify_services }}"
          sequence:
            - action: "{{ repeat.item }}"
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                data:
                  notification_icon: mdi:gate-alert
                  channel: Gate alerts
                  importance: high
                  ttl: 0
                  sticky: true
                  persistent: true
                  tag: "{{ notification_tag }}"
                  timeout: 43200
                  alert_once: true
                  actions:
                    - action: "{{ closing_order_id }}"
                      title: "{{ button_text }}"
                      icon: sfsymbols:lock

      - alias: Replace opening persistent notification if enabled
        if:
          condition: template
          value_template: !input persistent_notification
        then:
          - action: persistent_notification.create
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              notification_id: "{{ notification_tag }}"
    else:
      - alias: Set notification ids
        variables:
          title_id: |-
            {%
              if notification_type == 'open'
              and notification_delay != 0
            %}
              left_open
            {% else %}
              {{ notification_type }}
            {% endif %}
          message_id: "{{ title_id }}"
          button_id: "close"
      - alias: Get notification translation
        variables: *get_translation
      - alias: Get button translation
        variables: *get_translation_button
      - alias: Notify each user
        repeat:
          for_each: "{{ notify_services }}"
          sequence:
            - action: "{{ repeat.item }}"
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                data:
                  car_ui: "{{ car_visible }}"
                  notification_icon: mdi:gate-alert
                  channel: Gate alerts
                  importance: high
                  ttl: 0
                  sticky: true
                  persistent: "{{ notification_type == 'open' }}"
                  push:
                    sound:
                      name: "default"
                      critical: "{{ int(car_visible) }}"
                  tag: "{{ notification_tag }}"
                  timeout: |-
                    {% if notification_type == 'error' or is_state(gate, ['off', 'closed']) %}
                      30
                    {% else %}
                      43200
                    {% endif %}
                  chronometer: "{{ notification_delay != 0 }}"
                  when: "{{ (utcnow() - timedelta(minutes=notification_delay)) | as_timestamp | int }}"
                  actions: |-
                    {%
                      if notification_type == 'open'
                      and states[gate].domain in ['cover', 'switch']
                    %}
                      {{
                        [
                          {
                            'action': closing_order_id,
                            'title': button_text,
                            'icon': 'sfsymbols:lock'
                          }
                        ]
                      }}
                    {% else %}
                      {{ [] }}
                    {% endif %}

            - alias: Play TTS on each phone, if enabled
              if:
                condition: template
                value_template: !input phone_tts
              then:
                - action: "{{ repeat.item }}"
                  data:
                    message: TTS
                    data:
                      tts_text: "{{ message }}"
                      channel: Gate alerts
                      importance: high
                      ttl: 0
                      media_stream: !input phone_tts_stream

      - alias: Play TTS on each speaker
        repeat:
          for_each: "{{ speaker_tts_devices }}"
          sequence:
            - action: tts.speak
              data:
                cache: true
                media_player_entity_id: "{{ repeat.item }}"
                message: "{{ message }}"
              target: "{{ speaker_tts_service }}"

      - alias: Send persistent notification to dashboard, if enabled
        if:
          condition: template
          value_template: !input persistent_notification
        then:
          - action: persistent_notification.create
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              notification_id: "{{ notification_tag }}"

      - alias: Exec user extra actions
        sequence: !input extra_actions

  - wait_for_trigger:
    - alias: Wait for gate closed
      trigger: template
      id: closed
      value_template: "{{ is_state(gate, ['off', 'closed']) }}"

    - alias: Wait for gate opening
      trigger: template
      id: started_opening
      value_template: "{{ is_state(gate, ['on', 'opening']) }}"
      enabled: "{{ notification_type == 'close' }}"

    - alias: Wait for gate closing
      trigger: template
      id: started_closing
      value_template: "{{ is_state(gate, 'closing') }}"
      enabled: "{{ notification_type == 'open' }}"

    - alias: Wait for closing button press
      trigger: event
      id: closing_order
      event_type: mobile_app_notification_action
      event_data:
        action: "{{ closing_order_id }}"
      enabled: "{{ notification_type == 'open' }}"

    # Don't wait more than 12h, or remove notification after 30s in case of an error or gate closing without position tracking
    timeout: |-
      {% if notification_type == 'error' or is_state(gate, ['off', 'closed']) %}
        30
      {% else %}
        43200
      {% endif %}

  - alias: Stop if timer ran out but problem still present
    if:
      condition: template
      value_template: "{{ wait.remaining == 0 and not(notification_type == 'error' or is_state(gate, ['off', 'closed'])) }}"
    then:
      - stop: Timer ran out

  - alias: Close gate if user pressed closing button
    if:
      condition: template
      value_template: "{{ wait.trigger.id == 'closing_order' }}"
    then:
      - action: |-
          {% if states[gate].domain == 'switch' %}
            switch.turn_off
          {% elif states[gate].domain == 'cover' %}
            cover.close_cover
          {% endif %}
        target:
          entity_id: "{{ gate }}"

  - alias: Remove notification sent to users
    repeat:
      for_each: "{{ notify_services }}"
      sequence:
        - action: "{{ repeat.item }}"
          data:
            message: clear_notification
            data:
              tag: "{{ notification_tag }}"

  - alias: Remove persistent notification
    if:
      condition: template
      value_template: !input persistent_notification
    then:
      - action: persistent_notification.dismiss
        data:
          notification_id: "{{ notification_tag }}"

mode: restart
