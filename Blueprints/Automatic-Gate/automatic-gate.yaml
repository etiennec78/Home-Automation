blueprint:
  name: Automatic Gate ⛩️
  source_url: "https://github.com/etiennec78/Home-Automation/blob/master/Blueprints/Automatic-Gate/automatic-gate.yaml"
  domain: automation
  author: etiennec78
  description: |-
    # Automatic Gate ⛩️

    ## Description 📝
    Modular and secure gate automation that opens and closes your gate upon leaving or arriving
    Makes managing your gate while driving easier: You won't ever have to use your remote again

    ## Key Features 🌟
    * **Multi-User Support**: Manages up to 10 drivers simultaneously 🚗
    * **Broad Compatibility**: This blueprint is compatible with most vehicles and most travel time providers (Waze, Here, smart vehicles) 🔗
    * **Notification Translations**: This blueprint ships with built-in and custom translations 🌍
    * **Security & Reliability**:
      * Precise ETA calculations to have your gate fully open exactly when you arrive home 🎯
      * Vehicle status monitoring to cancel the itinerary and close the gate if you stop your vehicle or pass by without entering ✋
      * Collision prevention to ensure the gate doesn't close on anyone arriving or leaving at the same time 🚧
      * Built-in timeouts in case of an internet loss ⏳
      * Maximum entry and leaving time before auto-closing ⌛
      * Custom forbidden zones to cancel the itinerary when entered ⛔
      * Notification alerts at each decision of the automation 🚨
    * **Customizable Settings**:
      * Open/Close the gate
        * Automatically 🧠
        * By asking for a confirmation ✅
        * By starting a cancellable timer ⏱️
      * Customizable gate operation timings 🛠️
      * Customizable travel time refresh rate 🔁
      * Read notifications aloud on Android 🗣️
      * Multiple gate support ⛩️
      * Open/Close with iBeacon 📡
      * House locks support 🔐
      * Avoid opening when parked near house 🅿️

    ## More info ℹ️
    * Version: 2.0.0
    * Set up sensors: [click here](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md)
    * Github: [click here](https://github.com/etiennec78/Home-Automation/tree/master/Blueprints/Automatic-Gate)
    * Discord: @etiennec78
    [![ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/C0C5XVRMM)
  homeassistant:
    min_version: 2025.4.0
  input:
    essential_inputs:
      name: Essential inputs
      icon: "mdi:gate"
      collapsed: true
      input:
        gate:
          name: ⛩️ Gate
          description: The **switch** or **cover** which controls your **[gate](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md#gate-%EF%B8%8F)**
          selector:
            entity:
              multiple: true
              filter:
                domain:
                  - switch
                  - cover
        gate_location:
          name: 📍 Gate location
          description: The zone where your gate is located, to detect whether you are leaving or arriving
          default: "zone.home"
          selector:
            entity:
              filter:
                domain: zone
        lead_time:
          name: 🕓 Lead time
          description: The **lead time** to open the gate **before your arrival** (take your gate movement time & a margin into account)
          default: 75
          selector:
            number:
              min: 10
              max: 300
              unit_of_measurement: seconds

    per_person_sensors:
      name: Per person sensors
      icon: mdi:account-multiple
      collapsed: true
      description: |-
        ⚠️ Please enter the same amount of entires in each input, and place users in the same order
      input:
        persons:
          name: 👤 Tracked users
          description: |-
            Each **user** which should be **[tracked](https://github.com/etiennec78/Home-Automation/blob/master/sensors.gps-location-trackers--persons-)** for **position updates**
            *Notes :*
            *⚠️ Use high precision while driving in your ETA zone or you could time out*
            *If your tracker has report latency (wifi/ble), and you plug Android Auto just after leaving, your gate could open thinking you are still there*
          selector:
            entity:
              multiple: true
              filter:
                domain:
                  - device_tracker
                  - person
        driving_sensors:
          name: 🚗 Driving sensors
          description: Each **[driving sensor](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md#driving-sensors-)** which should trigger the automation
          selector:
            entity:
              multiple: true
              filter:
                domain:
                  - binary_sensor
                  - input_boolean
        travel_time_sensors:
          name: ✈️ Travel time sensors
          description: |-
            Each **[travel time sensor](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md#travel-time-sensors-%EF%B8%8F)** monitoring each user **time left before arrival**
            *⚠️ Please set a [custom polling interval](https://www.home-assistant.io/integrations/waze_travel_time/#defining-a-custom-polling-interval)*
            *Note: Optional if open when connected to iBeacon is true*
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: sensor
                device_class: duration
        notify_devices:
          name: 💬 Notify devices
          description: Each [**device** to **notify**](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md#notify-services-)
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        itinerary_sensors:
          name: 🗺️ Itinerary sensors
          description: Each empty **[itinerary input text](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md#itinerary-sensors-%EF%B8%8F)** helper to store each user **itinerary state**
          selector:
            entity:
              multiple: true
              filter:
                domain: input_text

    travel_time_settings:
      name: Travel time settings
      icon: mdi:timer
      collapsed: true
      input:
        activation_zone:
          name: 🔒 Gate activation zone
          description: |-
            At which **distance** from the gate should the automation start estimating when to **open your gate** ?
            Note: It will automatically **close** if you **leave** this zone
          default: 500
          selector:
            number:
              min: 300
              max: 5000
              unit_of_measurement: meters
        travel_time_rate:
          name: 🔄 Travel time refresh rate
          description: |-
            Calculate the Travel time & ETA

              - **Continuously** during the whole itinerary (custom refresh interval while away)
              - Only while the vehicle is **near home**
              - Only **once** when the vehicle gets near home
              - Listen to **external** sensor updates

            **"Continuously"** can use more Waze/Maps credits, but can be useful to display a precise ETA on your dashboard when far from your destination
            **"While near home"** allows to monitor if you drive near your gate without entering to abort the itinerary, or if there are traffic jams near home to open later (recommended)
            **"Only once"** uses the less amount of credits, but could trigger if you come near your gate without entering (not recommended)
            **"Listen for updates"** is made for vehicles providing their own travel time sensor. Do not use with an external travel time provider (e.g: Waze, Maps, Here)
          default: "near-home"
          selector:
            select:
              options:
                - label: Continuously
                  value: "continuous"
                - label: While near home
                  value: "near-home"
                - label: Once when near home
                  value: "once"
                - label: Listen for updates
                  value: "listen"
        continuously_refresh_interval:
          name: ⏳ Continuously refresh interval
          description: Your travel time **refresh interval** while away. Only active with a refresh rate set to **"Continuously"**
          default: 5
          selector:
            number:
              min: 1
              max: 60
              unit_of_measurement: minutes

    gate_behavior:
      name: Gate behavior
      icon: mdi:brain
      collapsed: true
      input:
        departure_opening_behavior:
          name: 🛫🔓 Departure opening behavior
          description: |-
            Automatic gate **opening** behavior on **departure**

              - **Fully automatic** : Your gate will automatically open
              - **Cancelable timer** : A notification of a cancelable timer will be sent before opening your gate
              - **Notification request** : An actionable notification will be sent to open your gate
              - **Disabled** : Your gate will stay closed
          default: "auto"
          selector:
            select:
              options:
                - label: Fully automatic
                  value: "auto"
                - label: Cancelable timer
                  value: "timer"
                - label: Notification request
                  value: "notif"
                - label: Disabled
                  value: "off"
        departure_closing_behavior:
          name: 🛫🔐 Departure closing behavior
          description: |-
            Automatic gate **closing** behavior on **arrival**

              - **Fully automatic** : Your gate will automatically close
              - **Cancelable timer** : A notification of a cancelable timer will be sent before opening your gate
              - **Notification request** : An actionable notification will be sent to close your gate
              - **Disabled** : Your gate won't close automatically
          default: "notif"
          selector:
            select:
              options:
                - label: Fully automatic
                  value: "auto"
                - label: Cancelable timer
                  value: "timer"
                - label: Notification request
                  value: "notif"
                - label: Disabled
                  value: "off"
        suggest_closing_after:
          name: 🔐 Suggest closing after
          description: The time the gate will wait before **suggesting to close** on departure if you are using a **notification request** but don't have a sensor to detect your absence
          default: 120
          selector:
            number:
              min: 1
              max: 600
              unit_of_measurement: seconds
        arrival_opening_behavior:
          name: 🛬🔓 Arrival opening behavior
          description: |-
            Gate automatic **opening** behavior on **arrival**

              - **Fully automatic** : Your gate will automatically open
              - **Cancelable timer** : A notification of a cancelable timer will be sent before opening your gate
              - **Notification request** : An actionable notification will be sent to open your gate
              - **Disabled** : Your gate will stay closed
          default: "auto"
          selector:
            select:
              options:
                - label: Fully automatic
                  value: "auto"
                - label: Cancelable timer
                  value: "timer"
                - label: Notification request
                  value: "notif"
                - label: Disabled
                  value: "off"
        arrival_closing_behavior:
          name: 🛬🔐 Arrival closing behavior
          description: |-
            Gate automatic **closing** behavior on **arrival**

              - **Fully automatic** : Your gate will automatically close
              - **Cancelable timer** : A notification of a cancelable timer will be sent before opening your gate
              - **Notification request** : An actionable notification will be sent to close your gate
              - **Disabled** : Your gate won't close automatically
          default: "auto"
          selector:
            select:
              options:
                - label: Fully automatic
                  value: "auto"
                - label: Cancelable timer
                  value: "timer"
                - label: Notification request
                  value: "notif"
                - label: Disabled
                  value: "off"
        timer_opening:
          name: ⏱️🔓 Cancelable timer time for opening
          description: The time before the gate automatically opens in "cancelable timer" mode without your input
          default: 5
          selector:
            number:
              min: 1
              max: 20
              unit_of_measurement: seconds
        timer_closing:
          name: ⏱️🔐 Cancelable timer time for closing
          description: The time before the gate automatically closes in "cancelable timer" mode without your input
          default: 15
          selector:
            number:
              min: 1
              max: 120
              unit_of_measurement: seconds

    security_features:
      name: Security features
      icon: mdi:security
      collapsed: true
      input:
        security_notif_override:
          name: 🔁 Override notification request for safety feature
          description: Change the closing behavior from "notification request" to "timer" if triggered by a safety feature
          default: true
          selector:
            boolean:
        safety_delay:
          name: 🔐 Auto-close safety delay
          description: The time the gate will wait before **automatically closing** if your gate is open but you still haven't left or arrived
          default: 5
          selector:
            number:
              min: 2
              max: 30
              unit_of_measurement: minutes
        timeout_delay:
          name: ⌛ Timeout delay
          description: |-
            The time the automation will wait before **stopping** if your phone **times out** and doesn't send new position updates, while being in the activation zone
            *Note : If your position provider doesn't let you use a high accuracy mode (like iOS), please increase this value*
          default: 2
          selector:
            number:
              min: 0.5
              max: 30
              unit_of_measurement: minutes
        forbidden_zones:
          name: ⛔ Forbidden zones
          description: If you enter any of these zones while driving home, your itinerary will be canceled
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: zone
        quick_triggers_reopen_gate:
          name: 🚨 Reopen gate if driving sensor triggers too quickly
          description: Reopen the gate if your driving sensor keeps turning on and off quickly, to avoid closing on your vehicle
          default: true
          selector:
            boolean:

    notification_settings:
      name: Notification settings
      icon: mdi:bell
      collapsed: true
      input:
        language:
          name: Notification language
          description: The **language** in which **notifications** will be sent to you
          default: "en"
          selector:
            language:
              languages:
                - en
                - fr
        custom_translations:
          name: Custom translations
          description: |-
            A **json** dictionary to change the default **notifications translations**
            *Note : You can find the translation keys in the strings['en'] variable in the code or in your traces*
          default: |-
            {
              "title": {},
              "message": {},
              "button": {}
            }
          selector:
            text:
              multiline: true
        itinerary_started_notif:
          name: 🏁 Itinerary started notification
          description: Whether or not to send a notification informing the user that his itinerary has been started
          default: true
          selector:
            boolean:
        phone_tts:
          name: 📳 Phone TTS
          description: Read notifications **aloud** on **Android** phones
          default: false
          selector:
            boolean:
        phone_tts_stream:
          name: 📻 Phone TTS audio stream
          description: The **audio stream** used for playing the phone TTS. Can be useful to **bypass Do Not Disturb**.
          default: "notification_stream"
          selector:
            select:
              options:
                - label: Notification stream
                  value: "notification_stream"
                - label: Alarm stream
                  value: "alarm_stream"
                - label: Alarm stream (max volume)
                  value: "alarm_stream_max"

    presence_sensors:
      name: Presence sensors
      icon: mdi:leak
      collapsed: true
      input:
        wifi_devices:
          name: 🏠 WiFi devices
          description: |-
            Each driver's WiFi device tracker
            *Note : Please place user sensors in the same order*
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: device_tracker
        ble_entities:
          name: 🔎 iBeacon tracker entities
          description: |-
            Each **[BLE rssi tracker entity](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md#bluetooth-entities-)** to monitor your distance from the gate
            *Note : Please place user sensors in the same order*
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: sensor
                device_class: signal_strength
        ble_transmitter_entities:
          name: 📡 iBeacon transmitter entities
          description: |-
            Each **[BLE transmitter entity](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md#bluetooth-transmitter-)** to restore previous iBeacon transmitter power settings when iBeacon is not needed anymore
            *Notes : Let empty if you use iOS, or only use iBeacon for this automation*
          default: []
          selector:
            entity:
              multiple: true
              filter:
                integration: mobile_app
                domain: sensor
                device_class: enum
        ble_scanner_switch:
          name: ⏯️ iBeacon scanner activator switch
          description: |-
            The **[switch](https://github.com/etiennec78/Home-Automation/blob/master/sensors.md#bluetooth-scanner-switch-)** to automatically **start and stop iBeacon scanning** when needed
            *Note : Leave empty if you want your iBeacon scanner to be always on*
          default: ""
          selector:
            entity:
              filter:
                domain: switch
        only_open_near:
          name: 🏠 Only open on departure while connected to
          description: |-
            Should your gate only open if you are connected to WiFi/iBeacon while leaving ?
            *Notes :*
            *Useful for preventing your gate from opening if you are parked in front of your house*
            *WiFi can be slow to report new states*
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: WiFi
                  value: wifi
                - label: iBeacon
                  value: ble
        only_open_near_timeout:
          name: ⌛ 'Only open while connected to' timeout
          description: The time the gate will wait for you to connect to WiFi/iBeacon before canceling the departure
          default: 10
          selector:
            number:
              min: 0
              max: 1800
              unit_of_measurement: seconds
        close_when_disconnected_from:
          name: 📡 Close on departure when disconnected from
          description: Close the gate if driver's iBeacon is out of range
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: iBeacon
                  value: ble
        open_when_connected_to:
          name: 📡 Open on arrival when connected to
          description: |-
            Open the gate when driver's iBeacon is reachable
            Enabling this will remove the need of a travel time sensor
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: iBeacon
                  value: ble

    locks:
      name: Door locks
      icon: mdi:door-closed-lock
      collapsed: true
      input:
        locks:
          name: 🔐 Locks
          description: |-
            The **locks** that open your home's **doors**
            *Note : They will lock on exit once the gate is closed, and unlock once the vehicle has arrived and been turned off*
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: lock
        dont_lock_if_people_remaining:
          name: 🏠 Do not lock if there are still people home
          description: |-
            Avoid locking locks if some person entities are still in the gate zone besides yourself
            Note : if you drive away with multiple people, they might still be detected home and prevent locking
          default: false
          selector:
            boolean:

