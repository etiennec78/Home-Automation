name: 🪲 Bug report - blueprint
description: Report an issue with a blueprint of this repository to help me find a fix
labels: bug
assignees: etiennec78
body:
  - type: markdown
    attributes:
      value: |
        ## Blueprint concerned 🎯
  - type: dropdown
    id: blueprint
    attributes:
      label: Blueprint
      description: Which blueprint is concerned by this bug ?
      options:
        - Automatic Gate
        - Charging Notification
        - Itinerary Tracker Notification
        - Gate Alerts
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Which branch of the repositoy are you using ?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Bug description 🪲
  - type: textarea
    validations:
      required: true
    attributes:
      label: Describe the bug
      description: |
        Provide a clear and concise description of what the problem is
  - type: markdown
    attributes:
      value: |
        ## Logs 📜
  - type: textarea
    attributes:
      label: Blueprint traces
      description: |
        You can download your blueprint traces by going into :
        *[Settings > Automations & scenes](https://my.home-assistant.io/redirect/automations) > Blueprint name > Traces (top right) > Three dots (top right) > Download trace*

        > [!WARNING]
        > Your logs will likely contain GPS coordinates

        > [!TIP]
        > You can remove sensitive information by running [this script](https://github.com/etiennec78/Home-Automation/blob/master/.github/ISSUE_TEMPLATE/traces_redactor.py) with the following command : `python3 traces_redactor.py trace.json`
      placeholder: Drag and drop your traces
  - type: markdown
    attributes:
      value: |
        ## Environment ⚙️
  - type: input
    id: version
    validations:
      required: true
    attributes:
      label: What version of Home Assistant are you running ?
      placeholder: core-
      description: |
        Can be found in: [Settings > System > Repairs > Three dots at top right > System information](https://my.home-assistant.io/redirect/system_health/).
  - type: markdown
    attributes:
      value: |
        ## Additional information ➕
  - type: textarea
    attributes:
      label: Additional information
      description: |
        Add any other context about the problem here
