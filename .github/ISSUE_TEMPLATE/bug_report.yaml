name: 🪲 Bug report - Other
description: Report an issue with any other project of this repository to help me find a fix
labels: bug
assignees: etiennec78
body:
  - type: markdown
    attributes:
      value: |
        ## Bug description
  - type: textarea
    validations:
      required: true
    attributes:
      label: Project of this repo containing the bug
      description: >-
        Write the name of the project of this repository that has an issue
  - type: textarea
    validations:
      required: true
    attributes:
      label: Describe the bug
      description: >-
        Provide a clear and concise description of what the problem is
  - type: markdown
    attributes:
      value: |
        ## Logs
  - type: textarea
    attributes:
      label: Related logs
      description: >-
        Check eyour Home Assistant [logs](https://my.home-assistant.io/redirect/logs/) and report any error related to your issue
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: input
    id: version
    attributes:
      label: What version of Home Assistant are you running ?
      placeholder: core-
      description: >
        Can be found in: [Settings > System > Repairs > Three Dots in Upper Right > System information](https://my.home-assistant.io/redirect/system_health/)
  - type: markdown
    attributes:
      value: |
        ## Additional information
  - type: textarea
    attributes:
      label: Additional information
      description: >
        Add any other context about the problem here
